<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ACE 开发助手 · 产品与供应链开发</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='0' y2='1'%3E%3Cstop offset='0' stop-color='%234C8BFF'/%3E%3Cstop offset='1' stop-color='%230E42D2'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Crect x='7' y='7' width='18' height='18' rx='4' fill='%23fff'/%3E%3Cpath d='M9.5 16l5.5 5.5 8-10.5' stroke='%231E56EF' stroke-width='3' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3C/svg%3E">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  color-scheme:light;
  --primary:#165DFF; --primary-soft:#E8F3FF; --ok:#00B42A; --ok-soft:#E8F7EA;
  --warn:#F53F3F; --warn-soft:#FFECE8; --amber:#FF7D00; --amber-soft:#FFF3E8;
  --gray:#86909C; --gray-light:#C9CDD4;
  --bg:#F7F8FA; --panel:#FFFFFF; --head:#F2F3F5; --line:#E5E6EB;
  --ink:#1D2129; --ink2:#4E5969; --ink3:#86909C;
  --severe:#C41D1D; --purple:#722ED1; --soft:#F7F8FA; --on-accent:#FFFFFF; --mask:#1D2129;
  --shadow:0 2px 8px rgba(0,0,0,.08);
}
/* ===== C7 暗色模式：html[data-theme="dark"] 覆盖变量（v1.0.39）===== */
html[data-theme="dark"]{
  color-scheme:dark;
  --primary:#4080FF; --primary-soft:rgba(64,128,255,.16); --ok:#23C343; --ok-soft:rgba(82,196,60,.16);
  --warn:#F76560; --warn-soft:rgba(247,101,96,.16); --amber:#FF9A2E; --amber-soft:rgba(255,154,46,.16);
  --gray:#6E7686; --gray-light:#4E5969;
  --bg:#17171A; --panel:#232324; --head:#2A2A2B; --line:#3A3A3C;
  --ink:#F2F3F5; --ink2:#A9AEB8; --ink3:#86909C;
  --severe:#F76560; --purple:#A871E8; --purple-soft:rgba(168,113,232,.16); --soft:#2A2A2B; --on-accent:#FFFFFF; --mask:rgba(0,0,0,.75);
  --shadow:0 2px 8px rgba(0,0,0,.5);
}
html,body{height:100%}
body{font-family:"Microsoft YaHei","PingFang SC",Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
.tnum{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink)}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.app{display:flex;min-height:100vh}
.side{width:220px;flex:none;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.logo{display:flex;align-items:center;gap:10px;padding:18px 20px;border-bottom:1px solid var(--line)}
.logo .mark{width:32px;height:32px;border-radius:8px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.logo .name{font-size:15px;font-weight:700}
.logo .sub{font-size:11px;color:var(--ink3)}
.nav{flex:1;padding:12px 10px;overflow:auto}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;color:var(--ink2);cursor:pointer;margin-bottom:2px;font-size:14px}
.nav-item svg{width:17px;height:17px;flex:none}
.nav-item:hover{background:var(--head)}
.nav-item.active{background:var(--primary-soft);color:var(--primary);font-weight:600}
.side-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;align-items:center;gap:10px}
.side-foot .avatar{width:32px;height:32px;border-radius:50%;background:var(--primary);color:var(--panel);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
.side-foot .who{font-size:13px;font-weight:600;line-height:1.3}
.side-foot .role{font-size:11px;color:var(--ink3)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{height:60px;flex:none;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:20}
.tb-title h1{font-size:18px;font-weight:700}
.tb-right{display:flex;align-items:center;gap:14px}
.search{background:var(--head);border:1px solid var(--line);border-radius:8px;padding:7px 12px;width:240px;font-size:13px;color:var(--ink2)}
.gs-wrap{position:relative;display:inline-block}
.currency{font-size:13px;color:var(--ink2);border:1px solid var(--line);border-radius:6px;padding:5px 10px}
.body{padding:24px;flex:1}
.card{background:var(--panel);border-radius:10px;box-shadow:var(--shadow);padding:16px}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--primary);color:var(--panel);border-radius:6px;padding:8px 14px;font-size:13px;font-weight:500;border:none;cursor:pointer}
.btn:hover{opacity:.9}
.btn svg{width:14px;height:14px}
.btn.ghost{background:var(--panel);color:var(--ink2);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--head)}
.btn.sm{padding:5px 10px;font-size:12px}
.tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:12px;font-weight:500}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.blue{background:var(--primary-soft);color:var(--primary)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.amber{background:var(--amber-soft);color:var(--amber)}
.tag.gray{background:var(--head);color:var(--gray)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}
.kpi{background:var(--panel);border-radius:10px;box-shadow:var(--shadow);padding:16px}
.kpi .k-label{font-size:13px;color:var(--ink3)}
.kpi .k-num{font-size:26px;font-weight:700;margin-top:6px}
.kpi .k-sub{font-size:12px;color:var(--ink3);margin-top:4px}
.kpi .k-num.r{color:var(--warn)} .kpi .k-num.o{color:var(--amber)} .kpi .k-num.g{color:var(--ok)}
.sec-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.sec-h h3{font-size:15px;font-weight:700}
.sec-h .more{font-size:12px;color:var(--primary);cursor:pointer}
.table-wrap{overflow:auto}
table{width:100%;border-collapse:collapse;table-layout:fixed}
th{background:var(--head);text-align:left;padding:10px 12px;font-size:12px;color:var(--ink2);font-weight:500;position:sticky;top:0}
td{padding:11px 12px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}
tr:hover td{background:var(--soft)}
tr.arch td{color:var(--gray-light)}
.gantt{background:var(--panel);border-radius:10px;box-shadow:var(--shadow);padding:16px;margin-bottom:20px}
.gantt-legend{display:flex;gap:16px;align-items:center;font-size:12px;color:var(--ink2);margin-bottom:12px;flex-wrap:wrap}
.gl-item{display:flex;align-items:center;gap:5px}
.gl-dot{width:10px;height:10px;transform:rotate(45deg);border-radius:2px}
.gantt-body{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.gantt-left{width:300px;flex:none;border-right:1px solid var(--line)}
.gantt-right{flex:1;overflow-x:auto;position:relative}
.g-row{display:flex;align-items:center;min-height:48px;border-bottom:1px solid var(--line);font-size:13px}
.g-cat{padding:6px 12px;font-weight:700;background:var(--soft);font-size:12px;color:var(--ink2)}
.g-name{padding:0 12px;flex:1;min-width:0}
.g-name .p{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-name .s{font-size:11px;color:var(--ink3);margin-top:2px}
.g-badge{flex:none;padding-right:12px}
.marker{position:absolute;top:50%;transform:translate(-50%,-50%) rotate(45deg);width:13px;height:13px;border-radius:2px;z-index:2;box-shadow:0 1px 3px rgba(0,0,0,.3);cursor:pointer}
.g-scale{height:32px;background:var(--head);border-bottom:1px solid var(--line);position:relative;flex:none}
.g-scale span{position:absolute;top:8px;font-size:11px;color:var(--ink2);font-weight:500;transform:translateX(4px)}
.todo-item{display:flex;gap:12px;padding:14px;border:1px solid var(--line);border-radius:8px;margin-bottom:10px}
.todo-item .ico{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex:none}
.todo-item .t-main{flex:1;min-width:0}
.todo-item .t-title{font-weight:600;font-size:14px}
.todo-item .t-desc{font-size:12px;color:var(--ink3);margin-top:3px}
.todo-item .t-act{font-size:12px;color:var(--ink2);margin-top:5px}
.todo-item .t-badge{flex:none;align-self:flex-start;font-size:12px;font-weight:600}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;font-size:12px}
.cal-head{text-align:center;color:var(--ink3);padding:4px 0}
.cal-cell{min-height:52px;border:1px solid var(--line);border-radius:6px;padding:3px 4px;position:relative;cursor:pointer}
.cal-cell:hover{border-color:var(--primary)}
.cal-cell .d{color:var(--ink2);font-size:11px}
.cal-cell .d.kd-over{color:var(--warn)}
.cal-cell.today{box-shadow:inset 0 0 0 1px var(--primary)}
.cal-cell.today .d{color:var(--primary);font-weight:700}
.cal-cell.ksel{background:var(--primary-soft);border-color:var(--primary)}
.cal-cell.other{background:var(--soft);color:var(--gray-light)}
.kdots{display:flex;gap:2px;margin-top:3px;flex-wrap:wrap}
.kdot{width:6px;height:6px;border-radius:50%;display:inline-block}
.kbadge{display:inline-block;min-width:14px;height:14px;line-height:14px;border-radius:7px;background:var(--primary-soft);color:var(--primary);font-size:10px;font-weight:600;text-align:center;margin-left:3px;padding:0 3px}
.kleg{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--ink3)}
.mask{position:fixed;inset:0;background:rgba(29,33,41,.45);z-index:100;display:none;align-items:center;justify-content:center}
.mask.open{display:flex}
.modal{background:var(--panel);border-radius:12px;width:560px;max-width:94vw;max-height:88vh;overflow:auto;box-shadow:0 12px 40px rgba(0,0,0,.2)}
.modal-h{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;font-size:16px;font-weight:700}
.modal-b{padding:20px}
.modal-f{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px}
.f-item{margin-bottom:14px}
.f-item label{display:block;font-size:12px;color:var(--ink2);margin-bottom:5px}
.f-item input,.f-item select,.f-item textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;font-size:13px}
.f-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:10px 18px;border-radius:8px;font-size:13px;z-index:200;display:none}
.empty{padding:40px;text-align:center;color:var(--ink3);font-size:13px}

.gantt2-scroll{overflow-x:auto;overflow-y:auto;padding:0 12px 12px;max-width:100%;scrollbar-width:thin}.gantt2-card{overflow:hidden}
.g2-head{display:flex;align-items:center;border-bottom:1px solid var(--line);margin-bottom:4px;position:relative}
.g2-head>div:last-child span{position:absolute;top:10px;font-size:11px;color:var(--ink3);transform:translateX(-50%)}
.g-row2{display:flex;align-items:center;border-bottom:1px solid var(--line);min-height:56px}
.g-name2{width:220px;flex-shrink:0;padding:8px 12px;cursor:pointer}
.g-row2:hover .g-name2{background:var(--soft)}
.g-name2 .pn{font-weight:600;font-size:13px}
.g-name2 .ps{font-size:11px;color:var(--ink3);margin-top:2px;display:flex;align-items:center}
.g-badge2{width:110px;flex-shrink:0;text-align:center}
.g-timeline{flex:1;position:relative;height:100%;min-height:56px}
.today-line{position:absolute;top:0;bottom:0;width:1px;background:var(--warn);z-index:2}
.ms{position:absolute;top:18px;width:18px;height:18px;border-radius:3px;transform:rotate(45deg);display:flex;align-items:center;justify-content:center;color:var(--on-accent);font-size:10px;font-weight:700;cursor:pointer;z-index:3}
.ms-date{position:absolute;top:24px;left:50%;transform:translateX(-50%) rotate(-45deg);font-size:10px;color:var(--ink3);white-space:nowrap}.ms-date.up{top:-18px}
.gantt2-legend{display:flex;gap:16px;padding:0 16px 12px;font-size:12px;color:var(--ink2);flex-wrap:wrap}

.todo-item2{display:flex;gap:12px;padding:14px;border-bottom:1px solid var(--line)}
.todo-item2:last-child{border-bottom:none}
.todo-ico{width:32px;height:32px;border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:16px}
.todo-main{flex:1}
.todo-t{font-weight:600;font-size:13px;display:flex;align-items:center}
.todo-d{font-size:12px;color:var(--ink2);margin-top:4px}
.todo-a{font-size:12px;color:var(--ink3);margin-top:4px}
.todo-b{font-size:13px;font-weight:600;flex-shrink:0}

.gantt2-legend .gl-dot{display:inline-block;width:12px;height:12px;border-radius:3px;transform:rotate(45deg);margin-right:4px;vertical-align:middle;text-align:center;line-height:12px}

.bar{height:6px;background:var(--head);border-radius:3px;overflow:hidden;margin-top:4px}
.bar>i{display:block;height:100%;border-radius:3px}
.eightd{display:inline-flex;gap:3px}
.eightd span{width:18px;height:18px;border-radius:3px;background:var(--head);color:var(--ink3);font-size:10px;display:flex;align-items:center;justify-content:center;font-weight:600}
.eightd span.done{background:var(--primary);color:var(--panel)}
.piedonut{width:120px;height:120px;border-radius:50%;position:relative;margin:0 auto}
.piedonut::after{content:'';position:absolute;inset:22px;background:var(--panel);border-radius:50%}
.piedonut .pc{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:14px;font-weight:700;z-index:1}
.trend{display:flex;align-items:flex-end;gap:10px;height:120px;padding:10px 0}
.trend .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.trend .col i{width:60%;background:var(--primary);border-radius:3px 3px 0 0;min-height:4px}
.trend .col b{font-size:11px;color:var(--ink3);font-weight:400}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px}
.tabs button{padding:8px 16px;font-size:13px;color:var(--ink2);border-bottom:2px solid transparent;cursor:pointer;margin-bottom:-1px}
.tabs button.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:600}
.kanban{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kanban .col{background:var(--soft);border-radius:8px;padding:10px;min-height:200px}
.kanban .col h4{font-size:13px;margin-bottom:10px;display:flex;justify-content:space-between}
.kanban .card-item{background:var(--panel);border-radius:6px;padding:10px;margin-bottom:8px;box-shadow:0 1px 3px rgba(0,0,0,.06);font-size:12px;cursor:pointer}
.prog-step{display:flex;align-items:center;gap:2px}
.prog-step i{flex:1;height:5px;border-radius:2px;background:var(--line)}
.prog-step i.on{background:var(--primary)}
@media(max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}.side{display:none}.search{width:140px}.gantt-left{width:200px}}
/* ===== C8 打印报表（v1.0.40）：#print-root 打印专用 DOM，固定黑白灰配色不随主题 ===== */
#print-root{display:none}
/* ===== C31 甘特拖放（v1.0.62）：拖拽中全局抓取光标+禁选中文本，浮动日期提示 ===== */
#pg-drag-tip{position:fixed;z-index:9999;background:var(--ink);color:var(--on-accent);font-size:11px;padding:3px 8px;border-radius:4px;pointer-events:none;box-shadow:var(--shadow);white-space:nowrap}
body.pg-dragging{cursor:grabbing!important}
body.pg-dragging *{cursor:grabbing!important;user-select:none!important}
@media print{
  body{background:#fff!important} /* 暗色主题下打印兜底：强制白底，防深色背景被打印 */
  body>*:not(#print-root){display:none!important}
  #print-root{display:block!important;color:#1D2129;background:#fff;font-size:12px;line-height:1.5}
  #print-root .pr-head{margin-bottom:14px;border-bottom:2px solid #1D2129;padding-bottom:8px}
  #print-root .pr-title{font-size:18px;font-weight:700}
  #print-root .pr-sub{font-size:11px;color:#666;margin-top:3px}
  #print-root .pr-card{page-break-inside:avoid;margin-bottom:14px}
  #print-root .pr-h{font-size:13px;font-weight:700;margin-bottom:6px}
  #print-root table{width:100%;border-collapse:collapse}
  #print-root th,#print-root td{border:1px solid #999;padding:4px 8px;text-align:left;font-size:11px;word-break:break-all}
  #print-root th{background:#f0f0f0;font-weight:600}
  #print-root tr{page-break-inside:avoid}
  @page{size:A4;margin:12mm}
}
</style>
</head>
<body>
<div id="print-root"></div>
<div id="auth-mask" style="position:fixed;inset:0;z-index:99999;background:var(--mask);display:flex;align-items:center;justify-content:center">
  <div style="width:360px;background:var(--panel);border-radius:12px;padding:32px;box-shadow:0 12px 40px rgba(0,0,0,.3)">
    <div style="text-align:center;margin-bottom:20px">
      <svg viewBox="0 0 32 32" width="46" height="46" style="margin-bottom:12px"><defs><linearGradient id="lg2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4C8BFF"/><stop offset="1" stop-color="#0E42D2"/></linearGradient></defs><rect width="32" height="32" rx="8" fill="url(#lg2)"/><rect x="7" y="7" width="18" height="18" rx="4" fill="#fff"/><path d="M9.5 16l5.5 5.5 8-10.5" stroke="#1E56EF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M28.3 25.2l-2.4 2.4 2.4 2.4 2.4-2.4z" fill="#A9D1FF"/></svg>
      <div style="font-size:20px;font-weight:700">ACE 开发助手</div>
      <div style="font-size:12px;color:var(--ink3);margin-top:4px" id="auth-sub">请登录本地账号</div>
    </div>
    <div id="auth-body"></div>
    <div id="auth-err" style="color:var(--warn);font-size:12px;margin-top:8px;min-height:16px"></div>
  </div>
</div>
<div class="app">
  <aside class="side">
    <div class="logo">
      <div class="mark"><svg viewBox="0 0 32 32" width="32" height="32"><defs><linearGradient id="lg1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4C8BFF"/><stop offset="1" stop-color="#0E42D2"/></linearGradient></defs><rect width="32" height="32" rx="8" fill="url(#lg1)"/><rect x="7" y="7" width="18" height="18" rx="4" fill="#fff"/><path d="M9.5 16l5.5 5.5 8-10.5" stroke="#1E56EF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M28.3 25.2l-2.4 2.4 2.4 2.4 2.4-2.4z" fill="#A9D1FF"/></svg></div>
      <div><div class="name">ACE 开发助手</div><div class="sub">产品与供应链开发</div></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <div class="avatar" id="foot-avatar">AS</div>
      <div><div class="who" id="foot-name">ASACE</div><div class="role">供应链主管</div></div>
    </div>
  </aside>
  <div class="main">
    <header class="topbar">
      <div class="tb-title"><h1 id="tb-title">仪表盘</h1></div>
      <div class="tb-right">
        <span id="tb-clock" style="font-size:12px;color:var(--ink2);white-space:nowrap" title="时间来源：联网同步，失败自动回退本地时钟"></span>
        <span class="gs-wrap">
          <input class="search" placeholder="搜索项目、供应商、订单、物料…" id="global-search" title="快捷键：Ctrl+K 聚焦；Alt+1~8 切换板块；Ctrl+S 立即保存" oninput="gsInput(this.value)" onfocus="globalSearch(this.value)" onkeydown="gsKey(event)">

   任一失败中止并保留原数据回落 localStorage（原子）。 */
var LS_DB='supplydev_db';       /* IndexedDB 库名 */
var LS_STORE='kv';              /* 对象仓库 */
var LS_MIG='supplydev_db_v1';   /* 迁移完成标记 */
var DB_READY=false,DB=null;     /* IndexedDB 就绪标志与句柄 */

  try{

    rq.onupgradeneeded=function(){var db=rq.result;if(db&&!db.objectStoreNames.contains(LS_STORE))db.createObjectStore(LS_STORE)};
    rq.onsuccess=function(){DB=rq.result;DB_READY=true;cb(DB)};

  }catch(e){cb(null)}

function storeGet(key){

  if(DB_MEM[key]!==undefined)return DB_MEM[key].v;

  }catch(e){cb(null)}

  if(!DB_READY||!DB)return;

  storeOpen(function(db){

  if(DB_READY&&DB){try{DB.close()}catch(e){}}

 * C20：新增 1.0 档（ISO 2859-1 Table 2-A 实表核对：小批量 A/B 码向下箭头级联到 n=5 Ac=0）；
 * 致命缺陷（Cr）行业惯例 Ac=0——按主要档同 n 抽检，出现任何致命缺陷即拒收 */
var AQL_TABLE={
 '1.0':[[2,25,5,0,1],[26,50,8,0,1],[51,90,13,0,1],[91,150,20,0,1],[151,280,32,1,2],[281,500,50,1,2],[501,1200,80,2,3],[1201,3200,125,3,4],[3201,10000,200,5,6],[10001,35000,315,7,8]],

};
function aqlPlan(lot,aql){
  lot=Math.max(1,Math.floor(+lot||0));
  var rows=AQL_TABLE[aql]||AQL_TABLE['2.5'];
  for(var i=0;i<rows.length;i++){var r=rows[i];if(lot<=r[1])return{lot:lot,n:r[2],ac:r[3],re:r[4],over:false};}
  var last=rows[rows.length-1];

}
/* RFC4180 CSV 解析：支持引号转义、CRLF、UTF-8 BOM */
function parseCSV(text){
  text=String(text||'').replace(/^\ufeff/,'');
  var rows=[],row=[],cur='',q=false;
  for(var i=0;i<text.length;i++){
    var c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){cur+='"';i++}else q=false}else cur+=c}
    else if(c==='"')q=true;
    else if(c===','){row.push(cur);cur=''}
    else if(c==='\n'){row.push(cur);rows.push(row);row=[];cur=''}
    else if(c==='\r'){}
    else cur+=c;
  }
  if(cur!==''||row.length){row.push(cur);rows.push(row)}
  return rows;
}
/* CSV 大文件分块读取：>512KB 分块（FileReader.slice），块间让出主线程防卡死，最后拼接。
   注意用 readAsArrayBuffer + 单个 TextDecoder({stream:true}) 流式解码——若用 readAsText 逐块独立解码，
   UTF-8 多字节字符跨块边界会被切坏成乱码（中文 CSV 大文件必踩） */
function readCSVText(f,cb){
  var CH=512*1024,size=f.size||0;
  if(!size||size<=CH){var r=new FileReader();r.onload=function(){cb(r.result)};r.readAsText(f,'utf-8');return}
  var dec=new TextDecoder('utf-8'),parts=[],off=0;
  (function next(){
    var r=new FileReader();
    r.onload=function(){
      parts.push(dec.decode(new Uint8Array(r.result),{stream:true}));
      off+=CH;
      if(off<size)setTimeout(next,0);
      else cb(parts.join('')+dec.decode()); /* 末块 flush 残留半字符 */
    };
    r.readAsArrayBuffer(f.slice(off,Math.min(off+CH,size)));
  })();
}

var LOG_SEQ=(function(){var mx=0;LOGS.forEach(function(e){if((e.q|0)>mx)mx=e.q|0});return mx+1})(); /* C23：自增序号（断点续号），稳定引用与排序 */

/* 联网时间同步：多源采样 → 中位数偏移 → 离群源自检 → 持久化偏移；失败回退本地时钟并周期重试 */
function syncTime(){
  if(TIME_SYNCING)return;TIME_SYNCING=true;
  var samples=[];
  function finish(){
    if(!TIME_SYNCING)return;TIME_SYNCING=false;
    if(samples.length){
      samples.sort(function(a,b){return a.off-b.off});
      var med=samples[Math.floor(samples.length/2)].off;
      var good=samples.filter(function(s){return Math.abs(s.off-med)<=1500}); /* 离群源（>1.5s）丢弃 */
      if(good.length){
        good.sort(function(a,b){return a.off-b.off});
        var _prevOff=TIME_OFFSET;
        TIME_OFFSET=good[Math.floor(good.length/2)].off; /* 取中位数偏移 */
        TIME_SRC=good.map(function(s){return s.src}).join('+');
        if(Math.abs(TIME_OFFSET-_prevOff)>60000){logLog('info','time','时钟偏移校正超 60s，全量刷新联动数据');RENDER();} /* C11：偏移大变化联动重渲染 */
        timeDriftRecord(TIME_OFFSET,TIME_SRC); /* C3：持久化偏移 + 漂移历史 + 超 5s 告警 */
        logLog('info','time','时间同步成功（'+TIME_SRC+'，采样 '+samples.length+' 源，偏移 '+Math.round(TIME_OFFSET/1000)+'s）');
      }else{
        logLog('warn','time','时间源相互不一致（'+samples.map(function(s){return s.src+':'+Math.round(s.off/1000)+'s'}).join('，')+'），使用本地时钟');
      }
    }else{
      logLog('warn','time','联网时间同步失败（离线或源不可达），使用本地时钟');
    }
    var el=document.getElementById('tb-clock');if(el)el.textContent=clockText();
  }
  var pending=0;
  function probe(fetchP,src){
    pending++;
    fetchP.then(function(r){return r.json()}).then(function(j){
      var ms=0;
      if(src==='淘宝时间源')ms=parseInt((j.data&&j.data.t)||'0',10);
      else if(src==='worldtimeapi')ms=j&&j.unixtime?j.unixtime*1000:0;
      else if(src==='timeapi.io')ms=j&&j.time?Date.parse(j.time):0;
      if(ms>0)samples.push({src:src,off:ms-Date.now()});
    }).catch(function(){}).then(function(){
      if(--pending===0)finish();
    });
  }
  try{probe(fetch('https://acs.m.taobao.com/gw/mtop.common.getTimestamp/',{cache:'no-store'}),'淘宝时间源')}catch(e){if(--pending===0)finish()}
  try{probe(fetch('https://worldtimeapi.org/api/timezone/Asia/Shanghai',{cache:'no-store'}),'worldtimeapi')}catch(e){if(--pending===0)finish()}
  try{probe(fetch('https://timeapi.io/api/Time/current/zone?timeZone=Asia/Shanghai',{cache:'no-store'}),'timeapi.io')}catch(e){if(--pending===0)finish()}
  setTimeout(function(){finish()},5000); /* 5s 兜底，避免某源挂起 */
}
function clockText(){
  var d=nowDate();
  var wd=['日','一','二','三','四','五','六'][d.getDay()];
  var flag=TIME_SYNCING?'⟳ 同步中':(TIME_SRC==='本地时钟'?'⚠ 未联网':'✓ 已同步');
  var src=TIME_SRC.length>14?TIME_SRC.slice(0,14)+'…':TIME_SRC; /* 多源名过长截断，防顶栏溢出 */
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+' 星期'+wd+' '+pad(d.getHours())+':'+pad(d.getMinutes())+'（'+flag+'·'+src+'）';
}
function startClock(){
  var el=document.getElementById('tb-clock');if(!el)return;
  el.textContent=clockText();
  setInterval(function(){el.textContent=clockText()},30000);
  setInterval(function(){syncTime()},30*60*1000); /* 周期校准：每 30 分钟重试，断网后自动恢复同步 */
}
function logLog(level,mod,msg,detail){
  if(_impPrev)return; /* C2 影子预跑：抑制全部日志写入，预览零副作用 */
  var lv=LOG_LEVELS[level]===undefined?1:LOG_LEVELS[level];
  var e={q:LOG_SEQ++,t:nowDT(),l:level,m:String(mod||'app'),g:String(msg||''),d:detail?String(detail).slice(0,600):''};
  LOGS.push(e);
  if(LOGS.length>LOG_CAP_MEM)LOGS=LOGS.slice(-LOG_CAP_DISK);
  if(lv>=LOG_LEVELS.warn)saveLogs(); /* 警告/错误立即落盘；debug/info 由关键节点与 beforeunload 批量落盘 */
  if(lv>=LOG_SHOW){try{console[level==='warn'?'warn':level==='error'?'error':'log']('[ACE]['+e.m+'] '+e.g,e.d||'')}catch(_e){}}
}

  if(ev&&ev.target&&ev.target!==window)return; /* C29：资源加载错误由下方 capture 监听器单点处理，防双记录 */
  logLog('error','global','未捕获异常：'+(ev.message||''),(ev.error&&ev.error.stack)||'');
});

  var r=ev.reason||{};

/* C29 日志成熟化增量①：资源加载失败捕获（capture 阶段，target 为元素时是资源错误非脚本异常） */
window.addEventListener('error',function(ev){
  var t=ev&&ev.target;
  if(!t||t===window)return; /* 无 target / window 级异常已由上方兜底处理 */
  var src=t.src||t.href||'';
  if(src.indexOf('data:')===0)return; /* 内联资源忽略 */
  logLog('warn','global','资源加载失败：'+(t.tagName||'?')+' '+(src||'(无 src)').slice(0,200));
},true);
/* C29 日志成熟化增量②：console.error 桥接到运行日志（第三方/被动 catch 的错误不再只进控制台）；
   _inLogConsole 防递归——logLog 自身的控制台输出不再回流 */
(function(){
  var _orig=console.error;
  console.error=function(){
    try{
      var args=Array.prototype.slice.call(arguments);
      var txt=args.map(function(a){return a instanceof Error?(a.message+'\n'+a.stack):String(a)}).join(' ').slice(0,600);
      if(!window._inLogConsole){window._inLogConsole=true;try{logLog('error','console','console.error：'+txt)}finally{window._inLogConsole=false}}
    }catch(_e){}
    return _orig.apply(console,arguments);
  };
})();

/* 状态迁移兜底：旧备份缺集合补空数组/删除内存态/补品类权重/补 8D 时间戳（load 与 storeReload 共用，防止两处口径漂移） */
function normalizeState(s){
  ['materials','processes','suppliers','bom','samples','quotes','orders','issues','actions','inspections','costVersions','_audit','_auditArc','priceHistory','team','deps','_delBaseDeps','baselines','cars','certs'].forEach(function(k){if(!Array.isArray(s[k]))s[k]=[]});
  delete s.importSessions; /* C2：导入会话为内存态（撤销用），不随状态持久化/JSON 备份导出 */
  if(!s.catWeights||typeof s.catWeights!=='object')s.catWeights={}; /* v1.1：品类分层权重配置 */
  s.actions.forEach(function(a){if(!Array.isArray(a.stepsTs))a.stepsTs=[]}); /* B4：8D 分步时间戳兜底（旧数据不误报 SLA） */
  return s;
}

function load(){
  try{
    var s=JSON.parse(storeGet(LS));
    if(s&&s.products){
      normalizeState(s);
      state=s;

      ensureDeps();       /* v1.1：无依赖时按基线链自动生成 + 悬空引用清理 */
      return s;
    }
  }catch(e){}
  var seed=SEED();state=seed;
  ensureMilestones(); /* 种子缺里程碑时兜底生成（旧版本种子） */
  ensureDeps();       /* v1.1：基线链自动连接 */

}

/* ===== C13 统一响应式更新层（v1.0.45） =====
   调研定案：单一数据源 + 派生即算 + 集中事务收口（React/Redux derived-state 原则的原生 JS 等价实现）。
   结构性保证：业务变更（红线）必经 persist() → persist 先全量重算派生数据（进度/状态/评分/基线/依赖兜底）
   再落盘 → 之后任何 RENDER 都必然基于新鲜派生值，「漏调 recalcX 导致联动陈旧」这一缺陷类被结构性消灭。
   recomputeDerived 返回漂移计数 {progress,status,score}，dataHealthCheck/定时自检复用同一内核。 */
var _inRecompute=false;
function recomputeDerived(){
  if(_inRecompute)return{progress:0,status:0,score:0};
  _inRecompute=true;
  try{
    var drift={progress:0,status:0,score:0};
    state.products.forEach(function(p){
      if(p.status!=='已完工'&&p.status!=='已归档'){var bs=p.status;syncProductStatus(p.id);if(p.status!==bs)drift.status++} /* 终态为人工口径，重算不改写 */
      var bp=p.progress||0;recalcProgress(p.id);if((p.progress||0)!==bp)drift.progress++;
    });
    state.suppliers.forEach(function(s){
      var bq=s.qualityScore,bd=s.deliveryScore,br=s.rating;
      recalcSupplierScore(s.id);
      if(s.qualityScore!==bq||s.deliveryScore!==bd||s.rating!==br)drift.score++;
    });
    /* C24：孤儿 parentId 净化——父分组不存在/非分组/跨产品时上移顶层（JSON 导入等异常路径防线，防子项在 WBS 树中不可见） */
    if(Array.isArray(state.milestones))state.milestones.forEach(function(m){
      if(!m.parentId)return;
      var g=byId(state.milestones,m.parentId);
      if(!g||g.kind!=='group'||g.productId!==m.productId)m.parentId='';
    });
    ensureMilestones();ensureDeps();
    return drift;
  }finally{_inRecompute=false}
}
/* P0 性能：persist 防抖合并——同时段多次变更只做一次 stringify+双通道写（stringify 全量 state 是主线程最大开销点）。
   关键路径（beforeunload/导入完成/storeReload 镜像回写/JSON 备份导入）必须用 flushPersist 立即落盘 */
var _persistTimer=null;
function persist(){
  if(_impPrev)return;
  if(!_inRecompute){try{recomputeDerived()}catch(e){logLog('error','sync','派生数据重算失败：'+e.message,e.stack)}}
  if(_persistTimer)return; /* 已有待写定时器：合并，不再重复调度 */
  _persistTimer=setTimeout(function(){_persistTimer=null;flushPersist()},150);
}
function flushPersist(){
  if(_persistTimer){clearTimeout(_persistTimer);_persistTimer=null}
  if(_impPrev)return;
  if(!_inRecompute){try{recomputeDerived()}catch(e){logLog('error','sync','派生数据重算失败：'+e.message,e.stack)}}
  var _t0=Date.now();
  storeSet(LS,JSON.stringify(state));
  var _st=Date.now()-_t0; /* C23：慢落盘观测 */
  if(_st>500)logLog('warn','store','主状态落盘耗时 '+_st+'ms（超 500ms 阈值，存储可能繁忙）');
  lastSaveAt=nowDT().slice(11,16);
  bkMarkChange(); /* C14：落盘成功即标记变更时间，周期备份据此判定「备份后是否有新变更」 */
}

  '<div class="f-item"><label>组成项名称</label><input id="f-name" value="'+esc(b.name)+'"></div>'+
  '<div id="f-matproc-wrap" style="display:'+(isAsm?'none':'block')+'"><div class="f-row"><div class="f-item"><label>物料</label><select id="f-mat">'+matOpts+'</select></div><div class="f-item"><label>工艺</label><select id="f-proc">'+procOpts+'</select></div></div></div>'+

    var nIsAsm=fv('f-btype')==='asm';
    var oldType=b.childProductId?'asm':'mat';
    b.name=fv('f-name');b.qty=+fv('f-qty');b.lossRate=(+fv('f-loss')||0)/100;
    if(nIsAsm){
      b.childProductId=fv('f-asm')||null;b.materialId=null;b.processId=null;
      if(!b.childProductId){toast('请选择半成品来源产品');return}
      if(bomReachable(b.childProductId,b.productId)){toast('不能选择该产品：会造成 BOM 循环引用');return}
    }else{
      b.materialId=fv('f-mat')||null;b.processId=fv('f-proc')||null;b.childProductId=null;
    }

/* BOM 可达性：fromPid 的 BOM 树能否走到 targetPid（用于创建半成品引用前拦截循环） */
function bomReachable(fromPid,targetPid,stack){
  stack=stack||{};
  if(stack[fromPid])return false;
  if(fromPid===targetPid)return true;
  stack[fromPid]=true;
  var found=false;
  state.bom.forEach(function(b){
    if(found||b.productId!==fromPid)return;
    if(b.childProductId&&bomReachable(b.childProductId,targetPid,stack))found=true;
  });
  delete stack[fromPid];
  return found;
}

  (state.quotes||[]).forEach(function(q){push('报价',q.id,pname(q.productId)+' 报价','¥'+q.price+' · MOQ '+q.moq+' · '+(q.status||''),'&#128176;','#00B42A')});

function toCSV(rows,headers,fname){
  var keys=headers.map(function(h){return h.key});
  var lines=[headers.map(function(h){return '"'+h.label+'"'}).join(',')];
  rows.forEach(function(r){
    lines.push(keys.map(function(k){
      var v=r[k];if(v==null)v='';
      v=String(v).replace(/"/g,'""');
      if(/^[=+@\t\r]/.test(v)||(v.charAt(0)==='-'&&isNaN(Number(v))))v=' '+v; /* CSV 公式注入防护：=+@/- 开头文本在 Excel/WPS 打开会被当公式执行；前导空格使其按文本处理，导入端 .trim() 无损还原（纯负数放行） */
      return '"'+v+'"';
    }).join(','));
  });
  var blob=new Blob(['\ufeff'+lines.join('\n')],{type:'text/csv;charset=utf-8'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='supplydev-'+(fname?fname+'-':'')+todayStr()+'.csv';a.click(); /* C10：文件名带模块名，下载目录多模块 CSV 不再同名混淆 */
}

/* ===== C5 备份加密：AES-GCM-256 + PBKDF2-SHA256（10 万迭代）信封；密码不落盘，忘密码不可恢复 =====
   信封格式：{"_app":"supplydev-enc","_enc":1,"kdf":"PBKDF2-SHA256","iter":100000,"salt":hex,"iv":b64,"data":b64(ct||tag)}
   ⚠ BK_ENC_ITER 变更前必须兼容旧信封（解密端按信封 iter 派生或保留旧常量），否则历史加密备份全部解不开 */
var BK_ENC_ITER=100000;
function u8ToB64(u8){var s='';for(var i=0;i<u8.length;i++)s+=String.fromCharCode(u8[i]);return btoa(s)}
function b64ToU8(b64){var s=atob(b64);var u8=new Uint8Array(s.length);for(var i=0;i<s.length;i++)u8[i]=s.charCodeAt(i);return u8}
function hexToU8(hex){return new Uint8Array(hex.match(/.{2}/g).map(function(h){return parseInt(h,16)}))}
function looksEncryptedBackup(text){
  try{var d=JSON.parse(text);return !!(d&&d._app==='supplydev-enc'&&d._enc===1&&typeof d.data==='string'&&typeof d.salt==='string'&&typeof d.iv==='string')}catch(e){return false}
}
async function bkKey(pass,saltHex){
  return crypto.subtle.deriveKey(
    {name:'PBKDF2',hash:'SHA-256',salt:hexToU8(saltHex),iterations:BK_ENC_ITER},
    await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']),
    {name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function encBackupText(obj,pass){
  var salt=randSalt(); /* 16 字节 CSPRNG 盐（复用登录模块 randSalt） */
  var iv=new Uint8Array(12);crypto.getRandomValues(iv);
  var key=await bkKey(pass,salt);
  var plain=new TextEncoder().encode(JSON.stringify(obj));
  var ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv:iv},key,plain));
  return JSON.stringify({_app:'supplydev-enc',_enc:1,_cipher:'AES-GCM',kdf:'PBKDF2-SHA256',iter:BK_ENC_ITER,salt:salt,iv:u8ToB64(iv),data:u8ToB64(ct)});
}
async function decBackupText(text,pass){
  var d=JSON.parse(text);
  if(!looksEncryptedBackup(text))throw new Error('不是加密备份文件');
  var key=await bkKey(pass,d.salt);
  var plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64ToU8(d.iv)},key,b64ToU8(d.data));
  return JSON.parse(new TextDecoder().decode(plain));
}

/* C5：7 天未备份提醒——自动备份（HTTP 通道）成功时记 LS_LBAK 时间戳，超 7 天启动提醒。
   LS_LBAK 为高频同步小 key（仅写时间戳，读不进业务），对齐 LS_AUTH/LS_TIME/LS_CATS 豁免口径，保持纯 localStorage */
var LS_LBAK='supplydev_last_backup';
var LS_LCHG='supplydev_last_change'; /* C14：最近一次数据变更时间（周期备份判定依据；高频同步小值，对齐 LS_LBAK 豁免口径，保持纯 localStorage） */
function bkMarkSuccess(){try{localStorage.setItem(LS_LBAK,String(Date.now()))}catch(e){}}
function bkLastBackup(){var v=parseInt(localStorage.getItem(LS_LBAK)||'0',10);return isNaN(v)?0:v}
function bkReminderDue(now){
  var last=bkLastBackup();
  if(!last)return true; /* 从未成功备份 → 提醒 */
  return now-last>7*86400000;
}
/* ===== C14 数据安全补强：变更标记 / 周期备份 / 完整性校验 ===== */
var BK_PERIOD=86400000; /* 周期备份阈值：24h */
function bkMarkChange(){try{localStorage.setItem(LS_LCHG,String(Date.now()))}catch(e){}}
function bkLastChange(){var v=parseInt(localStorage.getItem(LS_LCHG)||'0',10);return isNaN(v)?0:v}
function bkPeriodicDue(now){
  /* 仅当「确有新变更」且「距上次备份满 24h」才触发：无变更不重复写盘，避免备份被自身挤空 */
  var last=bkLastBackup(),chg=bkLastChange();
  if(!chg)return false;
  if(chg<=last)return false;
  if(last&&now-last<BK_PERIOD)return false;
  return true;
}
/* 备份发送统一入口（启动备份与周期备份共用；禁止另起 fetch 实现） */
function bkSendState(cb){
  cb=cb||function(){};
  if(typeof window.__BKPORT!=='number'){dbg('backup','备份通道未配置（bkport.js 缺失），跳过备份');cb(false);return} /* C23 */
  try{
    var r=fetch('http://127.0.0.1:'+window.__BKPORT+'/backup',{method:'POST',headers:{'Content-Type':'application/json','X-BK-Token':window.__BKTOKEN||''},body:JSON.stringify(state)});
    if(r&&r.then)r.then(function(resp){if(resp&&!resp.ok)logLog('warn','backup','备份通道返回 HTTP '+resp.status);cb(!!(resp&&resp.ok))}).catch(function(e2){logLog('error','backup','备份通道请求失败：'+(e2&&e2.message||e2));cb(false)}); /* C23：失败分级观测 */
    else cb(false);
  }catch(e){logLog('error','backup','备份发送异常：'+e.message);cb(false)}
}
/* 周期自动备份：每 5 分钟巡检一次（真正的门槛在 24h + 有变更，巡检只负责及时触发） */
function startPeriodicBackup(){
  if(typeof window.__BKPORT!=='number')return;
  setInterval(function(){
    if(_impPrev)return; /* C14：CSV/JSON 导入进行中不备份中间态 */
    if(!bkPeriodicDue(Date.now()))return;
    if(!(state.products&&state.products.length))return;
    bkSendState(function(ok){
      if(ok){bkMarkSuccess();logLog('info','backup','周期自动备份成功（满 24h 且备份后有数据变更）')}
      else logLog('warn','backup','周期自动备份失败：本地备份通道无响应');
    });
  },300000);
}
/* 完整性校验：向本地通道取最新备份的 SHA-256 与清单比对，损坏/截断即告警（服务端 see app.py verify_backup） */
function bkVerify(){
  if(typeof window.__BKPORT!=='number')return;
  try{
    var r=fetch('http://127.0.0.1:'+window.__BKPORT+'/verify?token='+encodeURIComponent(window.__BKTOKEN||''));
    if(r&&r.then)r.then(function(resp){return resp&&resp.json?resp.json():null}).then(function(j){
      if(!j)return;
      if(j.ok)logLog('info','backup','备份完整性校验通过：'+(j.file||'')+'（'+(j.size||0)+' 字节）');
      else if(String(j.reason||'').indexOf('no-backup')===0){/* 尚无备份可校验，静默 */}
      else{logLog('warn','backup','备份完整性校验异常：'+(j.reason||'')+(j.file?(' · '+j.file):''));toast('⚠ 最近一次自动备份校验异常，建议手动导出一次备份')}
    }).catch(function(){});
  }catch(e){}
}
/* 联动：客诉扣分、订单改产品状态、打样改产品状态 */
function recalcSupplierScore(sid){
  var s=byId(state.suppliers,sid);if(!s)return;
  dbg('score','评分重算：'+(s.name||sid)); /* C23：高频路径 debug 级 */
  var issues=state.issues.filter(function(i){return i.supplierId===sid});
  var open=issues.filter(function(i){return i.status==='待处理'||i.status==='调查中'}).length;
  var closed=issues.filter(function(i){return i.status==='已解决'||i.status==='已关闭'}).length;
  s.qualityScore=Math.max(40,Math.min(100,95-open*2+closed));
  // 交期分：逾期订单数（分批交付按未收货批次口径）+ P1 准时率/波动细化（有实收批次数据时启用）
  var orders=state.orders.filter(function(o){return o.supplierId===sid});
  var overdue=orders.filter(function(o){return diffDays(orderDue(o))<0&&o.step<4}).length;
  var pun=supPunctuality(sid);
  if(pun.n>0)s.deliveryScore=Math.max(40,Math.min(100,Math.round(90-overdue*3-pun.sigma*2-(1-pun.rate/100)*15)));
  else s.deliveryScore=Math.max(40,Math.min(100,90-overdue*3));
  /* v1.1 B1：事件自动扣分收敛后同步 ABCD 评级（评分→等级联动） */
  s.rating=supGrade(supScore(s));
}
/* v1.1 B1：品类分层权重——state.catWeights={品类:{quality,delivery,price}}，未配置品类回落默认 40/30/30 */
function supWeights(s){
  var dflt={quality:0.4,delivery:0.3,price:0.3};
  if(!s||!s.cats||!s.cats.length)return dflt;
  for(var i=0;i<s.cats.length;i++){
    var w=state.catWeights&&state.catWeights[s.cats[i]];
    if(w)return{quality:+w.quality||0,delivery:+w.delivery||0,price:+w.price||0};
  }
  return dflt;
}
/* 供应商综合评分：按品类权重加权（默认质量40% + 交期30% + 价格30%），权重和归一化 */
function supScore(s){var w=supWeights(s);var tot=w.quality+w.delivery+w.price;if(!(tot>0))return 75;return Math.round((s.qualityScore||75)*w.quality/tot+(s.deliveryScore||75)*w.delivery/tot+(s.priceScore||75)*w.price/tot)}
/* ABCD 四级：A≥90 / B≥80 / C≥70 / D<70（对齐评级表） */
function supGrade(sc){return sc>=90?'A':sc>=80?'B':sc>=70?'C':'D'}
/* P1 评分细化：交期准时率 + 波动（lead-time variability）——只统计带实收日期(receivedDate)的已收批次，旧数据无实收日期不计入防虚构 */
function supPunctuality(sid){
  var delays=[];
  state.orders.forEach(function(o){
    if(o.supplierId!==sid)return;
    (o.batches||[]).forEach(function(b){
      if(b.received&&b.receivedDate)delays.push(Math.round((parseDate(b.receivedDate)-parseDate(b.date))/86400000));
    });
  });
  if(!delays.length)return{n:0,rate:null,sigma:null};
  var onTime=delays.filter(function(d){return d<=0}).length;
  var mean=delays.reduce(function(a,d){return a+d},0)/delays.length;
  var sigma=Math.sqrt(delays.reduce(function(a,d){return a+(d-mean)*(d-mean)},0)/delays.length);
  return{n:delays.length,rate:Math.round(onTime/delays.length*100),sigma:Math.round(sigma*10)/10};
}
/* P1 评分细化：报价响应速度——供应商平均报价响应天数（询价日→报价日），无数据返回 null */
function supResp(sid){
  var ds=[];
  (state.quotes||[]).forEach(function(q){
    if(q.supplierId!==sid||!q.reqDate||!q.quoteDate)return;
    var d=Math.round((parseDate(q.quoteDate)-parseDate(q.reqDate))/86400000);
    if(d>=0)ds.push(d);
  });
  if(!ds.length)return null;
  return Math.round(ds.reduce(function(a,d){return a+d},0)/ds.length*10)/10;
}
function syncProductStatus(pid){
  var p=byId(state.products,pid);if(!p)return;
  var orders=state.orders.filter(function(o){return o.productId===pid});
  var samples=state.samples.filter(function(x){return x.productId===pid});
  var firstOrder=false;
  if(orders.length){p.status='生产中';if(!p.orderDate){p.orderDate=todayStr();firstOrder=true}}
  else if(samples.some(function(x){return x.status==='已确认'})){p.status='已下单'}
  else if(samples.length){p.status='打样中'}
  else if(['生产中','已下单','打样中'].indexOf(p.status)>=0){p.status='立项中'} /* 删除兜底：订单/打样清空后自动状态回落，防卡死旧状态（v1.0.41） */
  msRefillBaseline(p); /* 联动里程碑：补齐缺失基线 + 状态随项目状态推进 */
  if(firstOrder&&snapBaseline(pid,'首次下单'))logAudit('基线快照：'+pname(pid)+'（首次下单）');
}

/* ===== 成本引擎（支持半成品多级 BOM：递归展开、visited 防环） ===== */
function bomCost(b,visited){
  visited=visited||{};
  var m=b.materialId?byId(state.materials,b.materialId):null;
  var pr=b.processId?byId(state.processes,b.processId):null;
  var mat=m?m.price*b.qty*(1+(b.lossRate||0)):0;
  var proc=pr?pr.refPrice*(1+(pr.lossRate||0)):0;
  var sub=0;
  /* 栈式防环：factoryCost 入口自行标记/退出清除，同一半成品多次出现各自展开 */
  if(b.childProductId&&b.childProductId!==b.productId){
    sub=factoryCost(b.childProductId,visited)*b.qty*(1+(b.lossRate||0));
  }
  return {mat:mat,proc:proc,sub:sub,total:mat+proc+sub};
}
function factoryCost(pid,visited){
  visited=visited||{};
  if(visited[pid])return 0;
  visited[pid]=true;
  var s=0;state.bom.forEach(function(b){if(b.productId===pid)s+=bomCost(b,visited).total});
  delete visited[pid];
  return s;
}
/* ===== MRP 物料需求（按 BOM 递归展开半成品，含损耗） ===== */
function mrpCalc(pid,qty,visited){
  visited=visited||{};
  if(visited[pid]||!(qty>0))return {};
  visited[pid]=true;
  var need={};
  state.bom.forEach(function(b){
    if(b.productId!==pid)return;
    var q=qty*(+b.qty||0)*(1+(b.lossRate||0));
    if(b.childProductId&&b.childProductId!==b.productId){
      var subMap=mrpCalc(b.childProductId,q,visited);
      for(var k in subMap)need[k]=(need[k]||0)+subMap[k];
    }else if(b.materialId){
      need[b.materialId]=(need[b.materialId]||0)+q;
    }
  });
  delete visited[pid];
  return need;
}
function mrpRows(pid,qty){
  var need=mrpCalc(pid,qty);
  return Object.keys(need).map(function(mid){
    var m=byId(state.materials,mid);if(!m)return null;
    return {mid:mid,name:m.name,spec:m.spec||'',unit:m.unit,per:+m.price||0,total:need[mid]};
  }).filter(Boolean);
}
function landedCost(pid){var p=byId(state.products,pid);return factoryCost(pid)+p.freight+p.tariff}
function priceTarget(pid){var p=byId(state.products,pid);return landedCost(pid)/(1-p.commission-p.adRate-p.returnRate-p.margin)}

var LS_AUTH='supplydev_local_auth';
async function sha256(s){var buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return Array.from(new Uint8Array(buf)).map(function(b){return b.toString(16).padStart(2,'0')}).join('')}
function randSalt(){ /* 16 字节随机盐 hex；无 CSPRNG 环境回落 Math.random（盐无需保密，仅防预计算彩虹表） */
  var u8=new Uint8Array(16);
  try{crypto.getRandomValues(u8)}catch(e){for(var i=0;i<16;i++)u8[i]=Math.floor(Math.random()*256)}
  return Array.from(u8).map(function(b){return b.toString(16).padStart(2,'0')}).join('')
}
async function pbkdf2Hex(pass,saltHex){ /* PBKDF2-SHA256 10 万迭代，替代无盐单轮 sha256 存密码 */
  var key=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveBits']);
  var salt=new Uint8Array(saltHex.match(/.{2}/g).map(function(h){return parseInt(h,16)}));
  var bits=await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:salt,iterations:100000},key,256);
  return Array.from(new Uint8Array(bits)).map(function(b){return b.toString(16).padStart(2,'0')}).join('')
}
function authUnlock(u){CUR_USER=u;logAudit('用户登录：'+u); /* C23：登录打点 */$('#auth-mask').style.display='none';$('#foot-name').textContent=u;$('#foot-avatar').textContent=(u[0]||'U').toUpperCase();renderNav();RENDER();}

      '<button id="au-go" style="width:100%;padding:10px;background:var(--primary);color:var(--panel);border:none;border-radius:6px;font-weight:600">创建账号并进入</button>';
    $('#au-go').onclick=async function(){

    };
  }else{
    var acc=JSON.parse(saved);sub.textContent='欢迎回来，'+acc.user;
    $('#auth-body').innerHTML=

      '<button id="au-go" style="width:100%;padding:10px;background:var(--primary);color:var(--panel);border:none;border-radius:6px;font-weight:600">登 录</button>';
    $('#au-go').onclick=async function(){
      var ok;
      if(acc.salt){ok=await pbkdf2Hex($('#au-pass').value,acc.salt)===acc.hash}
      else{ /* 旧无盐账号：sha256 校验通过后透明升级为 PBKDF2+盐 */
        ok=await sha256(acc.user+'|'+$('#au-pass').value)===acc.hash;
        if(ok){var s2=randSalt();acc={user:acc.user,salt:s2,hash:await pbkdf2Hex($('#au-pass').value,s2)};localStorage.setItem(LS_AUTH,JSON.stringify(acc))}
      }
      if(!ok){$('#auth-err').textContent='密码不正确';return}
      authUnlock(acc.user);

}

/* 项目层面判断用日期（口径对齐真实业务）：未下单阶段（立项中/打样中）看打样截止，下单后看目标交期；各自缺失回退另一个 */
function projDueDate(p){

  return pre?(p.sampleDue||p.targetDate):(p.targetDate||p.sampleDue);

function projDelivered(p){

  for(var i=0;i<arr.length;i++){if(arr[i].productId===p.id&&arr[i].name==='交付'&&arr[i].status==='已完成')return true}
  return false;

/* 项目倒计时/逾期统一出口（红线：逾期算术只走 overdueState）：终态 ✓ 已完成 / 已交付 ✓ / 其余 overdueState 三级 */
function projDueState(p){
  if(p.status==='已完工'||p.status==='已归档')return{lvl:'terminal',label:'✓ 已完成',color:'#00B42A'};
  if(projDelivered(p))return{lvl:'delivered',label:'✓ 已交付',color:'#00B42A'};
  return overdueState(diffDays(projDueDate(p)));
}
function projHealth(p){ /* 健康度：基于 projDueState 统一口径（红线），终态绿、已交付绿、未排期灰 */
  var _hs=projDueState(p);
  if(_hs.lvl==='terminal')return{rank:4,label:'✓ 完成',c:'#00B42A'};
  if(_hs.lvl==='delivered')return{rank:2,label:'✓ 已交付',c:'#00B42A'};
  if(_hs.lvl==='none')return{rank:3,label:'未排期',c:'#86909C'};
  if(_hs.lvl==='severe')return{rank:0,label:_hs.label,c:'#C41D1D'};
  if(_hs.lvl==='over')return{rank:0,label:_hs.label,c:'#F53F3F'};
  if(_hs.lvl==='soon')return{rank:1,label:_hs.label,c:'#FF7D00'};
  return{rank:2,label:'健康',c:'#00B42A'};
}

/* ===== 里程碑独立实体（对齐 MS Project/Asana 成熟方案：可增删改、状态推进、甘特菱形、点击下钻） =====
 * state.milestones: {id, productId, name, date, status:'未开始'|'进行中'|'已完成', desc, color}
 * 旧数据无 milestones 时自动从产品字段迁移生成基线 */
/* 单产品基线里程碑（增量：已存在的同名里程碑不重复追加；新建/导入产品时调用） */
function msBaselineFor(p){
  state.milestones=state.milestones||[];
  var base=[
    {name:'打样截止',date:p.sampleDue,color:'#722ED1',done:!!p.confirmDate},
    {name:'样品确认',date:p.confirmDate,color:'#165DFF',done:!!p.orderDate},
    {name:'下单',date:p.orderDate,color:'#00B42A',done:p.status==='生产中'||p.status==='已完工'},
    {name:'交付',date:p.targetDate,color:'#FF7D00',done:p.status==='已完工'}
  ];
  base.forEach(function(b){
    if(!b.date)return;
    if(state.milestones.some(function(m){return m.productId===p.id&&m.name===b.name}))return;
    state.milestones.push({id:nextId(state.milestones,'ms'),productId:p.id,name:b.name,date:b.date,status:b.done?'已完成':'未开始',desc:'',color:b.color});
  });
}
function ensureMilestones(){
  if(Array.isArray(state.milestones))return;
  state.milestones=[];
  state.products.forEach(function(p){msBaselineFor(p)});
}
/* 产品字段日期变更时同步基线里程碑日期（仅当里程碑日期未被用户改过：与旧字段值一致才更新） */
function msSyncDates(p,oldS,oldT){
  (state.milestones||[]).forEach(function(m){
    if(m.productId!==p.id||m.kind==='group')return; /* C22：分组无业务日期 */
    if(m.name==='打样截止'&&m.date===oldS&&p.sampleDue&&p.sampleDue!==oldS)m.date=p.sampleDue;
    if(m.name==='交付'&&m.date===oldT&&p.targetDate&&p.targetDate!==oldT)m.date=p.targetDate;
  });
}
/* 状态联动：补齐此前因日期为空被跳过的基线里程碑 + 里程碑状态随项目状态自动推进 */
function msRefillBaseline(p){
  msBaselineFor(p);
  (state.milestones||[]).forEach(function(m){
    if(m.productId!==p.id||m.status==='已完成'||m.kind==='group')return; /* C22：分组无状态流转 */
    if(m.name==='打样截止'&&p.status!=='立项中'&&p.status!=='打样中')m.status='已完成';
    if(m.name==='样品确认'&&['已下单','生产中','已完工'].indexOf(p.status)>=0)m.status='已完成';
    if(m.name==='下单'&&(p.status==='生产中'||p.status==='已完工'))m.status='已完成';
    if(m.name==='交付'&&p.status==='已完工')m.status='已完成';
  });
}
/* ===== A3 计划基线快照：确认/下单时冻结里程碑日期，实际变更后偏差 >3 天黄 / >7 天红（基线不漂移） ===== */
function snapBaseline(pid,reason){
  state.baselines=state.baselines||[];
  var ms=(state.milestones||[]).filter(function(m){return m.productId===pid&&m.date&&!m.kind}).sort(function(a,b){return a.date<b.date?-1:1}); /* C22：分组不入基线 */
  if(!ms.length)return false;
  var sig=ms.map(function(m){return m.name+':'+m.date}).join('|');
  var last=(state.baselines||[]).filter(function(b){return b.productId===pid}).pop();
  if(last&&last._sig===sig)return false;
  state.baselines.push({id:nextId(state.baselines,'bl'),productId:pid,ts:nowDT(),reason:reason||'手动',items:ms.map(function(m){return{msId:m.id,name:m.name,date:m.date}}),_sig:sig});
  if(state.baselines.length>100)state.baselines=state.baselines.slice(-100);
  return true;
}
/* 最新基线（push 顺序即时间序） */
function latestBaseline(pid){
  var bs=(state.baselines||[]).filter(function(b){return b.productId===pid});
  return bs.length?bs[bs.length-1]:null;
}
/* 基线 vs 当前偏差列表 [{name,base,cur,diff}]：diff>0 当前晚于基线（延期）/ <0 提前 */
function baselineDrift(p){
  var b=latestBaseline(p.id);if(!b)return[];
  var out=[];
  b.items.forEach(function(it){
    var m=byId(state.milestones,it.msId);
    if(!m)m=(state.milestones||[]).find(function(x){return x.productId===p.id&&x.name===it.name});
    if(!m||!m.date||!it.date)return;
    out.push({name:it.name,base:it.date,cur:m.date,diff:daysBetween(it.date,m.date)});
  });
  return out;
}
/* 偏差着色与文案：|diff|≤3 灰正常 / >3 黄 / >7 红；提前绿 */
function driftBadge(d){
  if(d>7)return{label:'晚 '+d+' 天',c:'#F53F3F',cls:'warn'};
  if(d>3)return{label:'晚 '+d+' 天',c:'#FF7D00',cls:'warn'};
  if(d<0)return{label:'提前 '+(-d)+' 天',c:'#00B42A',cls:'ok'};
  return{label:'一致',c:'#86909C',cls:'gray'};
}
/* 项目详情页「计划基线对比」卡：最新基线 vs 当前里程碑日期双列 */
function baselineCardHTML(pid){
  var b=latestBaseline(pid);
  var h='<div class="sec-h"><h3>计划基线对比</h3><div style="display:flex;gap:8px;align-items:center">'+(b?'<span class="tag gray">'+b.ts.slice(0,16)+' · '+b.reason+'</span>':'')+'<button class="btn ghost sm" onclick="saveBaseline(\''+pid+'\')">存基线</button></div></div>';
  if(!b)return h+'<div class="empty" style="padding:12px 0">暂无基线 · 打样确认或首次下单时自动快照，也可点「存基线」手动保存当前计划</div>';
  var drift=baselineDrift(byId(state.products,pid));
  if(!drift.length)return h+'<div class="empty" style="padding:12px 0">基线条目与当前里程碑不匹配</div>';
  var rows=drift.map(function(dv){
    var bd=driftBadge(dv.diff);
    return '<tr><td>'+esc(dv.name)+'</td><td class="tnum">'+dv.base+'</td><td class="tnum">'+dv.cur+'</td><td><span style="color:'+bd.c+';font-weight:600">'+bd.label+'</span></td></tr>';
  }).join('');
  return h+'<div class="table-wrap"><table><thead><tr><th>里程碑</th><th>基线日期</th><th>当前日期</th><th>偏差</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
}
/* 手动保存计划基线（基线不随后续变更漂移，偏差对比见基线卡） */
function saveBaseline(pid){
  if(snapBaseline(pid,'手动')){logAudit('基线快照：'+pname(pid)+'（手动保存）');persist();toast('已保存计划基线');}
  else toast('里程碑日期无变化，未产生新基线');
  RENDER();
}
function msState(m){
  if(m.status==='已完成')return{cls:'ok',label:'已完成',c:'#00B42A',done:true}; /* C26：终态优先于未排期（C15 终态守卫口径） */
  if(!m.date)return{cls:'gray',label:'未排期',c:'#86909C',done:false}; /* C26：无日期里程碑不再显示「剩 NaN 天」 */
  var d=diffDays(m.date);
  if(d<0)return{cls:'warn',label:d<=-7?'严重逾期 '+(-d)+' 天':'已逾期 '+(-d)+' 天',c:d<=-7?'#C41D1D':'#F53F3F',done:false};
  if(m.status==='进行中')return{cls:'blue',label:'进行中 · 剩 '+d+' 天',c:'#165DFF',done:false};
  return{cls:'gray',label:d<=3?'临期 · 剩 '+d+' 天':'未开始 · 剩 '+d+' 天',c:d<=3?'#FF7D00':'#86909C',done:false};
}
/* ===== C22 两级 WBS（对标进度猫/MS Project）：阶段分组 + 工期条 =====
 * 实体扩展：kind:'group'=阶段分组（不参与进度/依赖/基线，仅收纳）；parentId=所属分组 id（仅一级）；endDate=工期条结束日期
 * 旧数据无新字段自动按顶层里程碑处理（向后兼容零迁移）；WBS 编码为展示层计算不落库 */
var wbsFold={};      /* 分组折叠状态（会话级 UI 状态，不落库） */
var pgScroll=0;      /* C30：项目甘特横向滚动记忆（RENDER 重建 DOM 后恢复，防「改完跳回开头」） */
var ganttExpand={};  /* 项目行展开状态（会话级 UI 状态，不落库） */
function msIsGroup(m){return m!=null&&m.kind==='group'}
function msChildren(pid,gid){return (state.milestones||[]).filter(function(m){return m.productId===pid&&m.parentId===gid&&m.kind!=='group'})} /* C22：分组不可为子项 */
function msTopItems(pid){return (state.milestones||[]).filter(function(m){return m.productId===pid&&!m.parentId&&m.kind!=='group'})}
function msGroups(pid){return (state.milestones||[]).filter(function(m){return m.productId===pid&&m.kind==='group'})}
function msGroupSpan(g){ /* 汇总跨度：子项 min(date)~max(endDate||date)；无有效子项返回 null */
  var ch=msChildren(g.productId,g.id),lo=null,hi=null,done=0;
  ch.forEach(function(m){
    if(msIsGroup(m)||!m.date)return;
    var e=(m.endDate&&m.endDate>m.date)?m.endDate:m.date;
    if(!lo||m.date<lo)lo=m.date;
    if(!hi||e>hi)hi=e;
    if(m.status==='已完成')done++;
  });
  return lo?{lo:lo,hi:hi,n:ch.filter(function(m){return !msIsGroup(m)}).length,done:done}:null;
}
function msWbsCodes(pid){ /* WBS 编码（展示层）：顶层 1,2,3…；分组子项 n.k */
  var codes={},n=0;
  (state.milestones||[]).filter(function(m){return m.productId===pid&&!m.parentId}).forEach(function(m){
    n++;codes[m.id]=String(n);
    if(msIsGroup(m)){var k=0;msChildren(pid,m.id).forEach(function(c){k++;codes[c.id]=n+'.'+k})}
  });
  return codes;
}
function wbsToggle(id){wbsFold[id]=!wbsFold[id];RENDER()}
function wbsUnfold(gid){ /* C30：往折叠分组写入子项后自动展开，防「加了看不到」的联动盲区 */
  if(gid&&wbsFold[gid]){delete wbsFold[gid];return true}
  return false;
}
function ganttExpandToggle(pid){ganttExpand[pid]=!ganttExpand[pid];RENDER()}
/* C11 死数据修复：项目进度随里程碑完成比例自动联动（有里程碑才覆盖，无里程碑保持手工值） */
function recalcProgress(pid){
  var p=byId(state.products,pid);if(!p)return;
  if(p.status==='已完工'||p.status==='已归档')return; /* C13：终态为人工口径，全量重算不改写（防订单全收货→已完工后被里程碑比例拉回，状态与进度自相矛盾） */
  var arr=(state.milestones||[]).filter(function(m){return m.productId===pid&&m.kind!=='group'}); /* C22：阶段分组不参与进度 */
  if(!arr.length)return;
  var done=arr.filter(function(m){return m.status==='已完成'}).length;
  var v=Math.round(done/arr.length*100);
  if(v!==p.progress){var _old=p.progress;p.progress=v;logAudit('进度联动：'+p.name+' '+_old+'% → '+v+'%（里程碑 '+done+'/'+arr.length+'）')}
}
/* 里程碑汇总：总数/已完成数/下一未完成里程碑（实体版优先，回退字段版） */
function msSummary(p){
  var arr=(state.milestones||[]).filter(function(m){return m.productId===p.id&&m.kind!=='group'}); /* C22：阶段分组不计数 */
  var total=arr.length,done=arr.filter(function(m){return m.status==='已完成'}).length;
  var next=null;
  if(arr.length){
    var open=arr.filter(function(m){return m.status!=='已完成'&&m.date});
    open.sort(function(a,b){return a.date<b.date?-1:1});
    next=open[0]||null;
  }
  if(!next){var fb=nextMilestone(p);if(fb)next={name:fb.label,date:fb.date}}
  return {total:total,done:done,next:next};
}

function delMilestone(id){

 * 数据红线：落盘唯一路径 pgDragCommit —— 日期回写 → logAudit → recalcProgress（C11 保存点）→ persist()（C13：自动 recomputeDerived）→ RENDER 实时刷新（时间轴范围自适应扩展）。

var PG_DAY_W=30; /* 日宽像素：projGanttHTML 与拖放位移换算同源 */
var pgDragState=null;
function pgDrag(ev,id,mode){
  var m=byId(state.milestones,id);
  if(!m||!m.date||msIsGroup(m))return; /* 分组汇总条=派生数据，禁止拖拽改写 */
  ev.stopPropagation();ev.preventDefault(); /* 双缘手柄阻断冒泡到整条；防文字选中/浏览器原生拖拽 */
  var bar=(mode==='move')?ev.currentTarget:ev.currentTarget.parentElement; /* C33：双缘手柄拖拽的幽灵作用于父条（手柄自身 origLeft=0 会飞离条体——C31 视觉盲区，e2e 只验了数据未验中程视觉） */
  pgDragState={id:id,mode:mode,x0:ev.clientX,el:bar,origLeft:parseFloat(bar.style.left)||0,origW:parseFloat(bar.style.width)||0,moved:false,days:0};
  document.addEventListener('mousemove',pgDragMove);
  document.addEventListener('mouseup',pgDragUp);
  document.addEventListener('keydown',pgDragCancel); /* C34：Esc 中断取消（还原幽灵条、摘全部监听、不落数据） */
}
function pgDragCancel(ev){ /* C34：拖拽中 Esc=取消 */
  if(!pgDragState||ev.key!=='Escape')return;
  var st=pgDragState;
  st.el.style.left=st.origLeft+'px';if(st.origW)st.el.style.width=st.origW+'px'; /* 还原幽灵条 */
  document.removeEventListener('mousemove',pgDragMove);
  document.removeEventListener('mouseup',pgDragUp);
  document.removeEventListener('keydown',pgDragCancel);
  pgDragState=null;
  document.body.classList.remove('pg-dragging');
  pgTipShow(0,0,'');
  toast('已取消拖拽');
}
function pgDragMove(ev){
  var st=pgDragState;if(!st)return;
  if(!st.moved&&Math.abs(ev.clientX-st.x0)<4)return; /* 阈值内仍视为点击 */
  if(!st.moved){st.moved=true;document.body.classList.add('pg-dragging')}
  st.days=Math.round((ev.clientX-st.x0)/PG_DAY_W);
  if(st.mode==='left'){ /* C33：左缘幽灵=父条左移+宽度收缩（钳最小一天宽，与 pgDragCommit 钳制同向） */
    st.el.style.left=(st.origLeft+st.days*PG_DAY_W)+'px';
    if(st.origW)st.el.style.width=Math.max(PG_DAY_W,st.origW-st.days*PG_DAY_W)+'px';
  }else if(st.mode==='right'){
    if(st.origW)st.el.style.width=Math.max(PG_DAY_W,st.origW+st.days*PG_DAY_W)+'px';
  }else st.el.style.left=(st.origLeft+st.days*PG_DAY_W)+'px';
  var m=byId(state.milestones,st.id),txt='';
  if(m){
    var _ld=st.days,_re='';
    if(st.mode==='left'&&m.endDate){var _nd=addDays(m.date,st.days);if(_nd>=m.endDate){_nd=addDays(m.endDate,-1);_re='（钳制）'}txt='开始 → '+_nd+_re+'（保持 ~ '+m.endDate+'）'} /* C34：提示与 pgDragCommit 钳制同口径，防「提示 10-20 实落 10-19」误导 */
    else if(st.mode==='right'&&m.endDate){var _ne=addDays(m.endDate,st.days);if(_ne<=m.date){_ne=addDays(m.date,1);_re='（钳制）'}txt='结束 → '+_ne+_re+'（保持 '+m.date+'）'}
    else txt=m.date+(m.endDate?' ~ '+m.endDate:'')+' → '+addDays(m.date,st.days)+(m.endDate?' ~ '+addDays(m.endDate,st.days):'');
  }
  pgTipShow(ev.clientX,ev.clientY,txt);
}
function pgTipShow(x,y,txt){ /* 拖拽浮动提示：跟随鼠标展示落点日期 */
  var t=document.getElementById('pg-drag-tip');
  if(!txt){if(t)t.remove();return}
  if(!t){t=document.createElement('div');t.id='pg-drag-tip';document.body.appendChild(t)}
  t.textContent=txt;t.style.left=(x+12)+'px';t.style.top=(y-28)+'px';
}
function pgDragCommit(id,mode,days){ /* 拖拽数据落盘唯一路径（可测试内核，verify.js 直接调用） */
  var m=byId(state.milestones,id);
  if(!m||!days||msIsGroup(m))return false; /* 0 位移 / 分组=不改数据 */
  var oldD=m.date,oldE=m.endDate||'';
  if(mode==='move'){
    m.date=addDays(m.date,days);
    if(m.endDate)m.endDate=addDays(m.endDate,days); /* 整体平移保持工期不变量 */
  }else if(mode==='left'){
    var nd=addDays(m.date,days);
    if(m.endDate&&nd>=m.endDate)nd=addDays(m.endDate,-1); /* 左缘钳制：不得越过右缘 */
    if(nd===m.date)return false;
    m.date=nd;
  }else if(mode==='right'){
    if(!m.endDate)return false; /* 里程碑节点无右缘 */
    var ne=addDays(m.endDate,days);
    if(ne<=m.date)ne=addDays(m.date,1); /* 右缘钳制：不得压到左缘 */
    if(ne===m.endDate)return false;
    m.endDate=ne;
  }else return false;
  logAudit('甘特拖拽：'+m.name+'（'+pname(m.productId)+'）'+oldD+(oldE?' ~ '+oldE:'')+' → '+m.date+(m.endDate?' ~ '+m.endDate:''));
  recalcProgress(m.productId); /* C11 红线：里程碑变更保存点 */
  persist(); /* C13 红线：业务变更必经 persist（自动 recomputeDerived） */
  return true;
}
function pgDragUp(ev){
  var st=pgDragState;
  document.removeEventListener('mousemove',pgDragMove);
  document.removeEventListener('mouseup',pgDragUp);
  document.removeEventListener('keydown',pgDragCancel); /* C34：正常松手同步摘 Esc 监听 */
  pgDragState=null;
  document.body.classList.remove('pg-dragging');
  pgTipShow(0,0,'');
  if(!st)return;
  if(!st.moved){msDrill(st.id);return} /* 未越阈值=点击下钻 */
  var _dm=byId(state.milestones,st.id);
  if(pgDragCommit(st.id,st.mode,st.days||0))toast('已更新：'+(_dm?_dm.name:'')); /* 0 位移拖回原位静默 */
  RENDER(); /* 实时刷新：拖出边界时时间轴范围随数据自适应扩展 */
}

/* ===== 任务依赖与关键路径（v1.1 P0：A2 连线式编辑 + A1 关键路径高亮） =====
 * 模型 state.deps: {id, from, to, type}，from/to 为里程碑 id，type ∈ FS/SS/FF/SF
 * 连线式编辑：甘特图头部「✎ 依赖编辑」开关 → 两段式点击菱形建立依赖，点击连线查看/删除
 * 关键路径：DAG 最长链（拓扑 EFT 递推 + 前驱回溯），路径节点/连线橙色高亮
 */
var ganttDepMode=false;   /* 依赖编辑模式开关 */
var depSel='';            /* 编辑模式下已选中的前置里程碑 id */
function isBaseMs(m){return MS_BASE.indexOf(m.name)>=0}
function msName(id){var m=byId(state.milestones,id);return m?(pname(m.productId)+' · '+m.name):'（已删除里程碑）'}
function daysBetween(a,b){return Math.round((parseDate(b)-parseDate(a))/86400000)}
function addDep(from,to,type,silent){
  state.deps=state.deps||[];
  var _fm=byId(state.milestones,from),_tm=byId(state.milestones,to);
  if((_fm&&_fm.kind==='group')||(_tm&&_tm.kind==='group')){if(!silent)toast('阶段分组不参与依赖连线，请选择具体里程碑');return false} /* C22 */
  if(state.deps.some(function(d){return d.from===from&&d.to===to}))return false; /* 同一对任务只允许一条依赖（UI/CSV/基线链统一双键去重） */
  state.deps.push({id:nextId(state.deps,'dp'),from:from,to:to,type:type});
  if(!silent)logAudit('新增依赖：'+msName(from)+' '+DEP_TYPES[type]+' '+msName(to));
  return true;
}
/* 依赖环检测：toId 是否已直接/间接可达 fromId（再连 from→to 会成环） */
function depReachable(fromId,toId,stack){
  if(fromId===toId)return true;
  stack=stack||{};
  if(stack[fromId])return false;
  stack[fromId]=true;
  var hit=false;
  (state.deps||[]).forEach(function(d){
    if(!hit&&d.from===fromId&&depReachable(d.to,toId,stack))hit=true;
  });
  delete stack[fromId];
  return hit;
}
/* 旧数据迁移：清理悬空引用；缺依赖时按产品基线里程碑链自动生成 FS（同名同序去重，用户删过的基线对记入 _delBaseDeps 不再复活） */
function ensureDeps(){
  if(!Array.isArray(state.deps))state.deps=[];
  if(!Array.isArray(state._delBaseDeps))state._delBaseDeps=[];
  state.deps=state.deps.filter(function(d){var fm=d&&byId(state.milestones,d.from),tm=d&&byId(state.milestones,d.to);return fm&&tm&&fm.kind!=='group'&&tm.kind!=='group'&&DEP_TYPES[d.type]}); /* C33：端点为阶段分组的依赖一并清除（任务转分组路径会残留，污染关键路径/连线渲染） */
  state._delBaseDeps=state._delBaseDeps.filter(function(p){return p&&byId(state.milestones,p.from)&&byId(state.milestones,p.to)});
  var byP={};
  (state.milestones||[]).forEach(function(m){if(m.productId&&!m.kind)(byP[m.productId]=byP[m.productId]||[]).push(m)}); /* C22：分组不入基线依赖链 */
  Object.keys(byP).forEach(function(pid){
    var arr=byP[pid].filter(isBaseMs).sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:0});
    for(var i=0;i<arr.length-1;i++){
      var f=arr[i],t=arr[i+1];
      if(state._delBaseDeps.some(function(p){return p.from===f.id&&p.to===t.id}))continue;
      addDep(f.id,t.id,'FS',true);
    }
  });
}
/* 种子跨项目演示链（仅全新数据）：展示跨项目关键路径，用 (产品ID,里程碑名) 定位避免硬编码 id */
function seedCrossDeps(){
  function find(pid,name){var a=(state.milestones||[]).filter(function(m){return m.productId===pid&&m.name===name});return a[0]||null}
  var chain=[['p1','交付'],['p2','打样截止'],['p2','样品确认'],['p2','交付'],['p3','打样截止']];
  for(var i=0;i<chain.length-1;i++){
    var f=find(chain[i][0],chain[i][1]),t=find(chain[i+1][0],chain[i+1][1]);
    if(f&&f.date&&t&&t.date)addDep(f.id,t.id,'FS',true);
  }
}
/* 关键路径：DAG 最长链。节点权重=依赖跨度天数（后继晚于前置的天数，负值取 0） */
function critPath(){
  var deps=(state.deps||[]).filter(function(d){return d&&byId(state.milestones,d.from)&&byId(state.milestones,d.to)});
  if(!deps.length)return{ids:[],set:{},links:{}};
  var nodes={},adj={},indeg={};
  deps.forEach(function(d){
    nodes[d.from]=1;nodes[d.to]=1;
    (adj[d.from]=adj[d.from]||[]).push(d);
    indeg[d.to]=(indeg[d.to]||0)+1;
  });
  Object.keys(nodes).forEach(function(n){if(!indeg[n])indeg[n]=0});
  var eft={},pred={};Object.keys(nodes).forEach(function(n){eft[n]=0});
  var q=Object.keys(nodes).filter(function(n){return indeg[n]===0}),cnt=0;
  while(q.length){
    var n=q.shift();cnt++;
    (adj[n]||[]).forEach(function(d){
      var w=Math.max(0,daysBetween(byId(state.milestones,d.from).date,byId(state.milestones,d.to).date));
      if(eft[n]+w>eft[d.to]){eft[d.to]=eft[n]+w;pred[d.to]=n}
      if(--indeg[d.to]===0)q.push(d.to);
    });
  }
  if(cnt!==Object.keys(nodes).length)return{ids:[],set:{},links:{}}; /* 有环防御（正常被拦截） */
  var out={};deps.forEach(function(d){out[d.from]=1});
  var end=Object.keys(nodes).filter(function(n){return !out[n]});
  var maxE=-1,last=null;
  end.forEach(function(n){if(eft[n]>maxE){maxE=eft[n];last=n}});
  if(last==null)return{ids:[],set:{},links:{}};
  var ids=[],cur=last;
  while(cur!==undefined&&cur!==null){ids.unshift(cur);if(pred[cur]===undefined)break;cur=pred[cur]}
  var set={},links={};
  ids.forEach(function(id){set[id]=1});
  if(ids.length>1){
    deps.forEach(function(d){if(set[d.from]&&set[d.to]&&pred[d.to]===d.from)links[d.id]=1});
  }
  return{ids:ids,set:set,links:links};
}
/* 关键路径节点逾期 → 下游受影响里程碑数（沿依赖图可达计数） */
function depDownstream(msid){
  var cnt=0,seen={};
  function walk(n){
    (state.deps||[]).forEach(function(d){
      if(d.from!==n||seen[d.to])return;
      seen[d.to]=1;cnt++;
      walk(d.to);
    });
  }
  walk(msid);
  return cnt;
}
/* 两段式依赖编辑：第一击选中前置，第二击弹类型选择；再次点击已选节点取消 */
function addDepClick(msid){
  if(!depSel){
    depSel=msid;toast('已选中「'+msName(msid)+'」作为前置，再点击一个里程碑建立依赖');
    RENDER();return;
  }
  if(depSel===msid){depSel='';toast('已取消选择');RENDER();return}
  var from=depSel,to=msid;depSel='';
  var fm=byId(state.milestones,from),tm=byId(state.milestones,to);
  if(!fm||!tm)return;
  if((state.deps||[]).some(function(d){return d.from===from&&d.to===to})){toast('「'+msName(to)+'」已存在来自「'+msName(from)+'」的依赖');RENDER();return}
  if(depReachable(to,from)){toast('非法依赖：会形成循环依赖（'+msName(to)+' 已直接/间接依赖 '+msName(from)+'）');RENDER();return}
  openModal('新建任务依赖',
  '<div class="f-item"><label>前置任务</label><input value="'+esc(msName(from))+'（'+fm.date+'）" disabled></div>'+
  '<div class="f-item"><label>后继任务</label><input value="'+esc(msName(to))+'（'+tm.date+'）" disabled></div>'+
  '<div class="f-item"><label>依赖类型</label><select id="f-dtype">'+
    '<option value="FS">FS · 完成→开始：前置完成后，后继才能开始</option>'+
    '<option value="SS">SS · 开始→开始：前置开始后，后继才能开始</option>'+
    '<option value="FF">FF · 完成→完成：前置完成后，后继才能完成</option>'+
    '<option value="SF">SF · 开始→完成：前置开始后，后继才能完成</option>'+
  '</select></div>'+
  '<div style="font-size:12px;color:var(--ink3)">非法依赖（自环/重复/成环）会被自动拦截；删除请点击甘特图中的连线。</div>',
  function(){
    var type=fv('f-dtype');
    if(addDep(from,to,type,false)){persist();closeModal();toast('已添加依赖');RENDER();}
    else{toast('该依赖已存在');}
  });
}
/* 依赖详情：点击连线查看前置/后继/类型/跨度，可删除 */
function depDrill(depId){
  var d=byId(state.deps,depId);if(!d)return;
  var fm=byId(state.milestones,d.from),tm=byId(state.milestones,d.to);
  if(!fm||!tm)return;
  var span=daysBetween(fm.date,tm.date);
  var spanHtml=span<0?'<span style="color:var(--warn)">⚠ 后继早于前置 '+(-span)+' 天，交付时序可能冲突</span>':(span+' 天（'+fm.date+' → '+tm.date+'）');
  openModal('任务依赖（'+DEP_TYPES[d.type]+'）',
  '<div style="font-size:13px;line-height:1.9">'+
    '前置：<strong>'+esc(msName(d.from))+'</strong>（'+esc(fm.date)+'）<br>'+
    '后继：<strong>'+esc(msName(d.to))+'</strong>（'+esc(tm.date)+'）<br>'+
    '类型：<span class="tag blue">'+d.type+' · '+DEP_TYPES[d.type]+'</span><br>'+
    '跨度：'+spanHtml+'<br>'+
    (span<0?'':'<div style="font-size:12px;color:var(--ink3)">关键路径上的依赖会以橙色高亮显示；删除后关键路径自动重算。</div>')+
  '</div>',
  function(){
    if(!confirm('确定删除该依赖？'))return;
    state.deps=state.deps.filter(function(x){return x.id!==depId});
    /* 基线链自动生成的依赖被用户删除后记入黑名单，防 ensureDeps 重启复活（仅同产品基线里程碑对的 FS） */
    if(fm.productId===tm.productId&&isBaseMs(fm)&&isBaseMs(tm)&&d.type==='FS'){
      state._delBaseDeps=state._delBaseDeps||[];
      if(!state._delBaseDeps.some(function(p){return p.from===d.from&&p.to===d.to}))state._delBaseDeps.push({from:d.from,to:d.to});
    }
    logAudit('删除依赖：'+msName(d.from)+' '+DEP_TYPES[d.type]+' '+msName(d.to));
    persist();closeModal();toast('已删除依赖');RENDER();
  },'删除');
}

/* ===== 项目下一里程碑与剩余天数 ===== */
function nextMilestone(p){
  // 返回 {date,label,done}
  var steps=[
    {label:'构思立项',date:p.ideaDate,done:true},
    {label:'打样截止',date:p.sampleDue,done:p.status!=='立项中'&&p.status!=='打样中'},
    {label:'样品确认',date:p.confirmDate,done:['已下单','生产中','已完工'].indexOf(p.status)>=0},
    {label:'下单日',date:p.orderDate,done:p.status==='已完工'}
  ];
  for(var i=0;i<steps.length;i++){
    if(steps[i].date && !steps[i].done) return steps[i];
  }
  return null;
}
function statusTag(s){
  var map={'立项中':'gray','打样中':'blue','样品确认':'blue','已下单':'blue','生产中':'amber','已完工':'ok','已归档':'gray'};
  return '<span class="tag '+ (map[s]||'gray')+'">'+s+'</span>';
}

/* 风险提醒：汇总逾期/超支/无BOM/无报价等业务风险 */
function riskItems(){
  var risks=[];
  state.products.forEach(function(p){
    if(p.status==='已归档'||p.status==='已完工')return;
    var lp=landedCost(p.id),tp=p.targetPrice||0;
    if(tp>0&&lp>tp)risks.push({lvl:'warn',t:'定价倒挂：'+p.name,d:'到岸成本 $'+lp.toFixed(2)+' 已超目标售价 $'+tp.toFixed(2),nav:'cost'});
    var bomN=state.bom.filter(function(b){return b.productId===p.id}).length;
    if(!bomN&&['已下单','生产中'].indexOf(p.status)>=0)risks.push({lvl:'warn',t:'已下单但无BOM：'+p.name,d:'成本无法核算，请尽快补录 BOM',nav:'cost'});
    var qn=state.quotes.filter(function(q){return q.productId===p.id}).length;
    if(!qn&&p.status==='打样中')risks.push({lvl:'info',t:'打样中无报价：'+p.name,d:'建议同步收集供应商报价便于比价',nav:'cost'});
    /* A3：基线偏差 >7 天 → 延期预警（点直达项目详情） */
    baselineDrift(p).forEach(function(dv){
      if(dv.diff>7)risks.push({lvl:'warn',t:'基线延期：'+p.name,d:esc(dv.name)+' 晚于计划 '+dv.diff+' 天（基线 '+dv.base+' → 当前 '+dv.cur+'），建议评估赶工或改期',nav:'project',pid:p.id});
    });
  });
  /* v1.1 A1：关键路径节点逾期 → 下游受影响预警（最严重影响面优先提示） */
  var cp=critPath();
  if(cp.ids.length>1){
    cp.ids.forEach(function(mid){
      var m=byId(state.milestones,mid);
      if(!m||m.status==='已完成'||diffDays(m.date)>=0)return;
      risks.push({lvl:'warn',t:'关键路径逾期：'+msName(mid),d:'里程碑 '+m.date+' 已逾期，下游依赖 '+depDownstream(mid)+' 个节点，建议优先加急',nav:'dashboard'});
    });
  }
  state.orders.forEach(function(o){
    var d=diffDays(orderDue(o));
    if(d<0&&o.step<4)risks.push({lvl:'warn',t:'订单逾期：'+o.code,d:esc(pname(o.productId))+' · '+overdueState(d).label+'，请加急跟进',nav:'order'});
    var es=etaState(o);
    if(es&&es.lvl==='severe'&&o.step<4)risks.push({lvl:'warn',t:'ETA 严重滞后：'+o.code,d:'按当前进度预计 '+es.eta+' 完成，晚于计划 '+es.bias+' 天，请评估加急或改期',nav:'order'});

  });

  (state.certs||[]).forEach(function(c){

/* 近期到期节点：未来 N 天的关键日期列表 */
function upcomingNodes(days=30){
  var nodes=[];
  state.products.forEach(function(p){
    [['打样截止',p.sampleDue],['样品确认',p.confirmDate],['下单日',p.orderDate],['交付',p.targetDate]].forEach(function(kv){
      if(!kv[1])return;if(p.status==='已完工'||p.status==='已归档')return;
      var d=diffDays(kv[1]);
      if(d>=0&&d<=days)nodes.push({date:kv[1],d:d,t:p.name+' · '+kv[0],nav:'projects'});
    });
  });
  state.orders.forEach(function(o){
    var d=diffDays(orderDue(o));
    if(d>=0&&d<=days)nodes.push({date:orderDue(o),d:d,t:o.code+' · 交期',nav:'order'});
  });
  state.actions.forEach(function(a){
    var d=diffDays(a.due);
    if(d>=0&&d<=days)nodes.push({date:a.due,d:d,t:a.title+' · 整改截止',nav:'quality'});

function dataHealthCheck(){
  var t0=Date.now();
  var drift=recomputeDerived();
  persist();
  var n=drift.progress+drift.status+drift.score,ms=Date.now()-t0;
  var msg=n?('自检完成（'+ms+'ms）：发现并修复 '+n+' 处不同步（进度 '+drift.progress+' / 状态 '+drift.status+' / 评分 '+drift.score+'）'):'自检完成（'+ms+'ms）：面板数据与底层实体一致，无漂移';
  logAudit('数据自检：重算进度 '+drift.progress+' / 状态 '+drift.status+' / 评分 '+drift.score+' 处');
  logLog(n?'warn':'info','selfcheck',msg);

  toast(msg);
  RENDER();
}

   兜住不经 persist 的外部因素漂移）；页面隐藏或弹窗编辑中跳过，不打扰输入 */
function startAutoSelfCheck(){
  setInterval(function(){
    if(document.hidden)return;
    var mm=document.getElementById('modal-mask');
    if(mm&&mm.style.display!=='none')return;
    try{
      var drift=recomputeDerived();
      var n=drift.progress+drift.status+drift.score;
      if(n){logLog('warn','selfcheck','定时自检修复 '+n+' 处派生漂移（进度 '+drift.progress+' / 状态 '+drift.status+' / 评分 '+drift.score+'）');toast('后台自检：已自动修复 '+n+' 处数据不同步');persist();RENDER()}
    }catch(e){logLog('error','selfcheck','定时自检失败：'+e.message,e.stack)}

function todosHTML(){
  var items=[];
  state.samples.forEach(function(sa){
    var p=byId(state.products,sa.productId);
    if(sa.status==='样品寄出'){
      items.push({lvl:'amber',title:'样品待确认：'+p.name,desc:esc(p.name)+' · '+esc(sname(sa.supplierId)),act:'请尽快完成样品评审并给出反馈意见',d:diffDays(sa.due)});
    }
  });
  state.orders.forEach(function(o){
    var d=diffDays(orderDue(o));
    if(o.status!=='已发货'&&o.status!=='已完工'&&o.step<6&&d<=7){
      items.push({lvl:d<0?'warn':'amber',title:(d<0?'订单已逾期：':'交期临近：')+o.code,desc:esc(pname(o.productId))+' · '+esc(sname(o.supplierId)),act:d<0?'立即联系供应商确认发货，安排加急':'跟进生产进度，确认按期交付',tip:d<0?ovTip('order',esc(o.code),orderDue(o)):'',d:d});
    }
  });
  state.issues.forEach(function(i){if(i.status==='待处理'||i.status==='调查中')items.push({lvl:'warn',title:'客诉待处理：'+i.title,desc:'判定：'+i.verdict,act:'核实不良并判定责任，回复供应商',d:0})});
  state.actions.forEach(function(a){var d=diffDays(a.due);if(d<=3&&a.status==='进行中')items.push({lvl:d<0?'warn':'amber',title:'整改'+(d<0?'已逾期':'临近')+'：'+a.title,desc:'截止 '+a.due,act:'跟进供应商整改进度',tip:d<0?ovTip('action',esc(a.title),a.due):'',d:d})});
  items.sort(function(a,b){return a.d-b.d});
  if(!items.length)return '<div class="empty">暂无待办</div>';
  return items.map(function(it){
    var color=it.lvl==='warn'?'var(--warn)':it.lvl==='amber'?'var(--amber)':'var(--ink3)';
    var badge=overdueState(it.d).label;
    return '<div class="todo-item"'+(it.tip?' title="'+it.tip+'"':'')+'><div class="ico" style="background:'+(it.lvl==='warn'?'var(--warn-soft)':it.lvl==='amber'?'var(--amber-soft)':'var(--primary-soft)')+'"><span style="color:'+color+'">!</span></div>'+
      '<div class="t-main"><div class="t-title">'+esc(it.title)+'</div><div class="t-desc">'+esc(it.desc)+'</div><div class="t-act">建议：'+esc(it.act)+'</div></div>'+
      (badge?'<div class="t-badge" style="color:'+color+'">'+badge+'</div>':'')+'</div>';
  }).join('');
}

function renderQuotes(pid){

  }).join('')||'<tr><td colspan="7" class="empty">暂无报价</td></tr>';
  var qs=state.quotes.filter(function(q){return q.productId===pid});
  var avg=qs.length?(qs.reduce(function(a,q){return a+(+q.price||0)},0)/qs.length).toFixed(2):null;
  var rec=null;

    (rec?'<span>综合推荐：<strong style="color:var(--ok)">'+esc(rec.s.name)+'（$'+(+rec.q.price).toFixed(2)+'，MOQ '+rec.q.moq+'，综合分 '+supScore(rec.s)+' 按品类加权）</strong></span>':'')+
    '</div>':'';
  $('#q-body').innerHTML='<div class="card"><div class="sec-h"><h3>供应商比价 · '+esc(pname(pid))+'</h3><div style="display:flex;gap:8px"><button class="btn ghost csv-btn" data-module="quotes" data-pid="'+pid+'">CSV</button><button class="btn ghost" onclick="importCSV(\'quotes\')">导入</button><button class="btn" onclick="openQuote(\''+pid+'\')">+ 新增报价</button></div></div>'+analysis+

function quoteStatus(qid,st){
  var q=byId(state.quotes,qid);if(!q)return;
  var old=q.status;
  if(st==='已采纳'&&old!=='已采纳'){
    state.quotes.forEach(function(x){if(x.productId===q.productId&&x.id!==q.id&&x.status==='已采纳')x.status='已拒绝'});
  }
  q.status=st;
  if(q.supplierId)recalcSupplierScore(q.supplierId); /* C11：采纳/拒绝联动供应商评分 */
  logAudit('报价'+(st==='已采纳'?'采纳':'状态更新')+'：'+pname(q.productId)+' · '+sname(q.supplierId)+' $'+q.price+'（'+old+' → '+st+'）');
  persist();toast('报价已标记：'+st+'，供应商评分已联动重算');RENDER();
}

var LS_CATS='supplydev_custom_cats';

function toggleNewCat(){var w=document.getElementById('f-newcat-wrap');if(w)w.style.display=w.style.display==='none'?'flex':'none'}
function confirmCustomCat(selId){
  var el=document.getElementById('f-newcat');
  if(!el||!el.value||!el.value.trim()){toast('请输入品类名称');return}
  var name=el.value.trim();
  var list=customCatList();
  if(list.indexOf(name)>=0){toast('品类已存在：'+name);return}
  list.push(name);localStorage.setItem(LS_CATS,JSON.stringify(list));
  logAudit('添加自定义品类：'+name);
  toast('已添加自定义品类：'+name);
  var sel=document.getElementById(selId);
  if(sel){var o=document.createElement('option');o.value=name;o.textContent=name;o.selected=true;sel.appendChild(o)}
  var w=document.getElementById('f-newcat-wrap');if(w)w.style.display='none';
  if(el)el.value='';
}
/* 动态品类下拉：SEED_CATS ∪ 现有项目/供应商品类 ∪ 自定义品类，避免新建/编辑丢品类 */
function catOptions(sel){
  var pool={};(typeof SEED_CATS!=='undefined'?SEED_CATS:['首饰','服装','3C数码','户外用品','家居']).forEach(function(c){pool[c]=1});
  state.products.forEach(function(p){if(p.cat)pool[p.cat]=1});
  state.suppliers.forEach(function(s){(s.cats||[]).forEach(function(c){if(c)pool[c]=1})});
  customCatList().forEach(function(c){if(c)pool[c]=1});
  return Object.keys(pool).map(function(c){return '<option'+(c===sel?' selected':'')+'>'+esc(c)+'</option>'}).join('');
}

/* B4：8D 八步名称（SLA 悬停说明用） */
var D8_STEPS=['建立小组','描述问题','临时措施','根本原因','纠正措施','验证效果','预防再发','总结闭环'];
/* B4：8D 每步 48h SLA——当前进行步的进入时间（首步=创建时间，后续步=上一步完成时间）起算，超 48h 标红 */
function d8Sla(a){
  var done=Math.floor((a.completionRate||0)/100*8);
  if(done>=8)return null;
  a.stepsTs=a.stepsTs||[];
  var entered=done===0?(a.createdAt||''):a.stepsTs[done-1]||'';
  if(!entered)return {h:null,over:false,label:'—',done:done};
  var h=(Date.parse(nowDT())-Date.parse(entered))/3600000;
  return {h:h,over:h>48,label:h>48?'超时 '+Math.floor(h)+'h':'SLA '+Math.ceil(48-h)+'h',done:done};
}
/* B4：同供应商 30 天内客诉 ≥3 次自动触发 CAR（未关闭 CAR 存在时不重复触发） */
function checkAutoCAR(sid){
  state.cars=state.cars||[];
  var cutoff=Date.parse(nowDT())-30*86400000;
  var recent=state.issues.filter(function(i){return i.supplierId===sid&&i.createdAt&&Date.parse(i.createdAt)>=cutoff});
  if(recent.length<3)return;
  if(state.cars.some(function(c){return c.supplierId===sid&&c.status!=='已关闭'}))return;
  state.cars.push({id:nextId(state.cars,'car'),supplierId:sid,issueIds:recent.map(function(x){return x.id}),ts:nowDT(),status:'待评审',desc:'近30天 '+recent.length+' 次客诉自动触发'});
  logAudit('自动触发 CAR：'+sname(sid)+'（近30天客诉 '+recent.length+' 次）');
  persist();toast('⚠ 供应商 '+sname(sid)+' 近30天客诉 '+recent.length+' 次，已自动触发 CAR');
}

  state.cars=state.cars||[];
  var open=state.cars.filter(function(c){return c.status!=='已关闭'});

/* C20：当前表单的三档 AQL 方案（GB/T 2828.1 水平Ⅱ：同批量同字码同 n，仅 Ac 随 AQL 档变化；致命档 Ac 恒 0） */
function inspectionPlanNow(){

/* B3：MRP 在手/在途输入 → 净需求即时重算 */
function mrpOnhand(mid,v){
  window._mrpOnhand=window._mrpOnhand||{};
  window._mrpOnhand[mid]=Math.max(0,+v||0);
  var r=(window._mrpRows||[]).filter(function(x){return x.mid===mid})[0];
  if(!r)return;
  var need=Math.ceil(r.total*1000)/1000;
  var net=Math.max(0,need-window._mrpOnhand[mid]);
  var nc=net<=0?'#86909C':net<need?'#FF7D00':'#1D2129';
  var el=document.getElementById('mrp-net-'+mid);if(el){el.textContent=net;el.style.color=nc}
  var amt=document.getElementById('mrp-netamt-'+mid);if(amt)amt.textContent='$'+(net*r.per).toFixed(2);
}

function simCalc(){
  var d=window._simData;if(!d)return;
  var fx=+document.getElementById('sim-fx').value||1;
  var newTotal=0,baseTotal=0;
  d.rows.forEach(function(r,i){
    var np=+document.getElementById('sim-p-'+i).value, nq=+document.getElementById('sim-q-'+i).value;
    var b=byId(state.bom,r.bid);
    var loss=b?b.lossRate:0;
    var nv=np*nq*(1+loss)*fx;
    var proc=b&&b.processId?byId(state.processes,b.processId):null;
    var procC=proc?proc.refPrice*(1+proc.lossRate):0;
    nv+=procC;
    newTotal+=nv;baseTotal+=r.base;
    var cell=document.getElementById('sim-new-'+i);
    if(cell){cell.textContent='$'+nv.toFixed(2);cell.style.color=Math.abs(nv-r.base)>0.005?'#FF7D00':'inherit';cell.style.fontWeight='600'}
  });
  var p=byId(state.products,d.pid);
  var freight=(p.freight||0)*fx, tariff=(p.tariff||0)*fx;
  var newLanded=newTotal+freight+tariff;
  var baseLanded=landedCost(d.pid);
  var tp=p.targetPrice||0;
  var newMargin=tp>0?Math.round((tp-newLanded)/tp*100):0;
  var baseMargin=tp>0?Math.round((tp-baseLanded)/tp*100):0;
  var delta=newLanded-baseLanded;
  var dc=delta>0.005?'var(--warn)':delta<-0.005?'var(--ok)':'#86909C';
  document.getElementById('sim-result').innerHTML=
  '<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px">'+
  '<div class="kpi"><div class="k-label">基准到岸成本</div><div class="k-num tnum">$'+baseLanded.toFixed(2)+'</div></div>'+
  '<div class="kpi"><div class="k-label">模拟到岸成本</div><div class="k-num tnum" style="color:'+dc+'">$'+newLanded.toFixed(2)+'</div><div class="k-sub">'+(delta>0?'+':'')+delta.toFixed(2)+'</div></div>'+
  '<div class="kpi"><div class="k-label">基准毛利率</div><div class="k-num tnum">'+baseMargin+'%</div></div>'+
  '<div class="kpi"><div class="k-label">模拟毛利率</div><div class="k-num tnum '+(newMargin>=(p.margin*100)?'g':'r')+'">'+newMargin+'%</div><div class="k-sub">目标 '+(p.margin*100)+'%</div></div>'+
  '</div>'+
  (tp>0&&newLanded>tp?'<div style="margin-top:10px;font-size:13px;color:var(--warn);font-weight:600">⚠ 模拟到岸成本已超目标售价 $'+tp.toFixed(2)+'，建议重新定价或压价</div>':'');
}
