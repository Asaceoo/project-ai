/* B3：两版本 BOM 物料级差异：新增(蓝)/删除(灰)/涨价(红)/降价(绿) */
function diffVersionBOM(a,b){
  var mapA={},mapB={};
  a.items.forEach(function(x){mapA[x.pid]=x});b.items.forEach(function(x){mapB[x.pid]=x});
  var out=[];
  Object.keys(mapB).forEach(function(pid){
    var B=mapB[pid],A=mapA[pid];
    var rows=[];
    if(A&&A.bom&&B.bom){
      var bm={},am={};
      B.bom.forEach(function(x){bm[x.name]=x});
      A.bom.forEach(function(x){am[x.name]=x});
      Object.keys(bm).forEach(function(n){
        var nb=bm[n],na=am[n];
        if(!na){rows.push({kind:'add',name:n,from:'—',to:'$'+nb.total.toFixed(2),delta:'新增'});return}
        var d=nb.total-na.total;
        if(d>0.005)rows.push({kind:'up',name:n,from:'$'+na.total.toFixed(2),to:'$'+nb.total.toFixed(2),delta:'+$'+d.toFixed(2)});
        else if(d<-0.005)rows.push({kind:'down',name:n,from:'$'+na.total.toFixed(2),to:'$'+nb.total.toFixed(2),delta:'-$'+(-d).toFixed(2)});
      });
      Object.keys(am).forEach(function(n){if(!bm[n])rows.push({kind:'del',name:n,from:'$'+am[n].total.toFixed(2),to:'—',delta:'删除'})});
    }
    out.push({pid:pid,name:B.name,oldFp:A?A.fp:null,newFp:B.fp,rows:rows});
  });
  return out;
}
function compareCostVersions(){
  state.costVersions=state.costVersions||[];
  var a=state.costVersions[+document.getElementById('cv-a').value];
  var b=state.costVersions[+document.getElementById('cv-b').value];
  if(!a||!b){toast('请选择两个版本');return}
  var hasBom=a.items.some(function(x){return x.bom})&&b.items.some(function(x){return x.bom});
  if(!hasBom){
    /* 旧版本快照（无 bom 明细）降级为产品级工厂成本对比 */
    var rows=b.items.map(function(it){
      var old=a.items.filter(function(x){return x.pid===it.pid})[0];
      var ofp=old?old.fp:null;
      var delta=ofp==null?null:it.fp-ofp;
      var c=delta==null?'#86909C':delta>0.005?'#F53F3F':delta<-0.005?'#00B42A':'#86909C';
      return '<tr><td>'+esc(it.name)+'</td><td class="tnum">'+(ofp==null?'新增':'$'+ofp.toFixed(2))+'</td><td class="tnum">$'+it.fp.toFixed(2)+'</td><td class="tnum" style="font-weight:600;color:'+c+'">'+(delta==null?'—':(delta>0?'+':'')+'$'+delta.toFixed(2))+'</td></tr>';
    }).join('');
    document.getElementById('cv-diff').innerHTML='<div style="font-size:12px;color:var(--ink3);margin-bottom:8px">'+a.date+' '+a.time+' → '+b.date+' '+b.time+'（工厂成本口径 · 旧版快照无物料明细）</div><div class="table-wrap"><table><thead><tr><th>产品</th><th>旧成本</th><th>新成本</th><th>变化</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
    return;
  }
  var diff=diffVersionBOM(a,b);
  var K={up:'#F53F3F',down:'#00B42A',add:'#165DFF',del:'#86909C'};
  var bodyHtml=diff.map(function(d){
    var fpD=d.oldFp==null?'新增':d.newFp-d.oldFp;
    var fpC=d.oldFp==null?'#165DFF':fpD>0.005?'#F53F3F':fpD<-0.005?'#00B42A':'#86909C';
    var fpTxt=d.oldFp==null?'—':'$'+d.oldFp.toFixed(2)+' → $'+d.newFp.toFixed(2);
    var rowsHtml=d.rows.length?d.rows.map(function(r){
      return '<tr><td style="padding-left:28px">'+esc(r.name)+'</td><td class="tnum">'+r.from+'</td><td class="tnum">'+r.to+'</td><td class="tnum" style="font-weight:600;color:'+K[r.kind]+'">'+r.delta+'</td></tr>';
    }).join(''):'<tr><td colspan="4" style="padding-left:28px;color:var(--ink3)">无物料级变化</td></tr>';
    return '<tr style="background:var(--soft)"><td style="font-weight:600">'+esc(d.name)+'</td><td colspan="2" class="tnum" style="font-size:12px;color:var(--ink3)">工厂成本 '+fpTxt+'</td><td class="tnum" style="font-weight:600;color:'+fpC+'">'+(typeof fpD==='string'?fpD:(fpD>0?'+':'')+'$'+fpD.toFixed(2))+'</td></tr>'+rowsHtml;
  }).join('');
  document.getElementById('cv-diff').innerHTML='<div style="font-size:12px;color:var(--ink3);margin-bottom:8px">'+a.date+' '+a.time+' → '+b.date+' '+b.time+'（物料级差异 · <span style="color:var(--warn)">涨</span>/<span style="color:var(--ok)">降</span>/<span style="color:var(--primary)">新增</span>/<span style="color:var(--ink3)">删除</span>）</div><div class="table-wrap"><table><thead><tr><th>产品 / 物料</th><th>旧值</th><th>新值</th><th>变化</th></tr></thead><tbody>'+bodyHtml+'</tbody></table></div>';
}

  if(!pid){body.innerHTML='<div class="empty">暂无项目</div>';return}
  var p=byId(state.products,pid);
  var pts=state.costVersions.filter(function(v){return v.items.some(function(x){return x.pid===pid})}).map(function(v,i){
    var it=v.items.filter(function(x){return x.pid===pid})[0];
    return {i:i,label:it.name,vn:state.costVersions.indexOf(v)+1,date:v.date,time:v.time,fp:it.fp,lp:it.lp};
  });
  if(!pts.length){body.innerHTML='<div class="empty">该产品暂无成本快照，BOM 变更或保存快照后自动生成</div>';return}
  var W=760,H=240,PL=62,PR=18,PT=18,PB=34;
  var iw=W-PL-PR,ih=H-PT-PB;
  var vals=[];pts.forEach(function(x){vals.push(x.fp);vals.push(x.lp)});
  var vmin=Math.min.apply(null,vals),vmax=Math.max.apply(null,vals);
  if(vmin===vmax){vmin*=.9;vmax=vmin===0?10:vmax*1.1}
  var pad=(vmax-vmin)*.12;vmin-=pad;vmax+=pad;
  var span=vmax-vmin||1;
  var X=function(i){return PL+(pts.length===1?iw/2:iw*i/(pts.length-1))};
  var Y=function(v){return PT+ih-(v-vmin)/span*ih};
  function line(key,c){
    var d=pts.map(function(x,i){return (i?'L':'M')+X(i).toFixed(1)+','+Y(x[key]).toFixed(1)}).join(' ');
    return '<path d="'+d+'" fill="none" stroke="'+c+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
  }
  function dots(key,c){
    return pts.map(function(x){
      var t='V'+(x.vn)+' · '+x.date+' '+(x.time||'')+(key==='fp'?' 工厂 $':' 落地 $')+x[key].toFixed(2);
      return '<circle cx="'+X(x.i).toFixed(1)+'" cy="'+Y(x[key]).toFixed(1)+'" r="3.5" fill="#fff" stroke="'+c+'" stroke-width="2" style="cursor:pointer"><title>'+esc(t)+'</title></circle>';
    }).join('');
  }
  var yTicks=[];var nT=4;
  for(var k=0;k<=nT;k++)yTicks.push(vmin+span*k/nT);
  var yGrid=yTicks.map(function(v){return '<line x1="'+PL+'" y1="'+Y(v).toFixed(1)+'" x2="'+(W-PR)+'" y2="'+Y(v).toFixed(1)+'" stroke="#EEF0F3" stroke-width="1"/>'+'<text x="'+(PL-8)+'" y="'+(Y(v)+4).toFixed(1)+'" text-anchor="end" font-size="11" fill="#86909C">$'+fmt(v)+'</text>'}).join('');
  var xTicks=pts.map(function(x,i){
    var skip=pts.length>7&&i%2===1;
    return '<line x1="'+X(i).toFixed(1)+'" y1="'+(PT+ih)+'" x2="'+X(i).toFixed(1)+'" y2="'+(PT+ih+4)+'" stroke="#EEF0F3" stroke-width="1"/>'+
    (skip?'':'<text x="'+X(i).toFixed(1)+'" y="'+(H-PB+16)+'" text-anchor="middle" font-size="10" fill="#86909C">'+x.date+'</text>');
  }).join('');
  var legend='<div style="display:flex;gap:16px;font-size:12px;margin-bottom:8px">'+
  '<span style="display:flex;align-items:center;gap:6px"><span style="width:18px;height:0;border-top:2px solid var(--primary);display:inline-block"></span>工厂成本</span>'+
  '<span style="display:flex;align-items:center;gap:6px"><span style="width:18px;height:0;border-top:2px solid var(--amber);display:inline-block"></span>落地成本（含运费关税）</span>'+
  '<span style="color:var(--ink3)">'+pts.length+' 个版本</span></div>';
  var last=pts[pts.length-1];
  var delta=pts.length>1?last.fp-pts[0].fp:0;
  var dc=delta>0.005?'#F53F3F':delta<-0.005?'#00B42A':'#86909C';
  var summary='<div style="font-size:12px;color:var(--ink3);margin-top:8px">'+(p?esc(p.name):'')+' 当前工厂成本 <strong style="color:var(--primary)">$'+last.fp.toFixed(2)+'</strong>，落地成本 <strong style="color:var(--amber)">$'+last.lp.toFixed(2)+'</strong>'+(pts.length>1?'，较首个版本 <span style="font-weight:600;color:'+dc+'">'+(delta>0?'+':'')+'$'+delta.toFixed(2)+'</span>':'')+'</div>';
  body.innerHTML=legend+
  '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;max-width:'+W+'px;background:var(--panel);border-radius:8px">'+
  '<rect x="'+PL+'" y="'+PT+'" width="'+iw+'" height="'+ih+'" fill="none" stroke="#EEF0F3" stroke-width="1"/>'+yGrid+xTicks+
  line('fp','#165DFF')+line('lp','#FF7D00')+dots('fp','#165DFF')+dots('lp','#FF7D00')+'</svg>'+summary;
}
function fmt(v){return v>=1000?v.toFixed(0):v.toFixed(2)}

var VIEWS={dashboard:viewDashboard,projects:viewProjects,product:viewProduct,cost:viewCost,supplier:viewSupplier,order:viewOrder,quality:viewQuality,team:viewTeam,help:viewHelp,project:viewProjectDetail};
/* P0 性能：同帧多次渲染合并（rAF 优先，16ms 兜底）。仅用于纯 UI 筛选类高频交互；业务动作路径仍直接 RENDER 保证同步语义 */
var _renderQueued=false;
function scheduleRender(){
  if(_renderQueued)return;
  _renderQueued=true;
  var fire=function(){_renderQueued=false;RENDER()};
  if(typeof requestAnimationFrame==='function')requestAnimationFrame(fire);else setTimeout(fire,16);
}
function restorePgScroll(){var _pg=document.getElementById('pg-scroll');if(_pg&&pgScroll>0)_pg.scrollLeft=pgScroll} /* C33：甘特横向滚动恢复抽公用——tab 切换走 viewProjectDetail 不经 RENDER，双站点都调（防甘特⇄其他 tab 往返滚动位丢失） */
function RENDER(){
  var t0=Date.now();
  dbg('view','渲染 '+ROUTE);
  try{
    VIEWS[ROUTE]();
    restorePgScroll(); /* C30+C33 */
    var _rt=Date.now()-t0; /* C23：慢渲染观测——超 300ms 告警，正常走 debug 防噪声 */
    if(_rt>300)logLog('warn','view','渲染 '+ROUTE+' 耗时 '+_rt+'ms（超 300ms 阈值，数据量大或存在低效渲染）');
    else dbg('view','渲染完成 '+ROUTE+'（'+_rt+'ms）');
  }catch(err){
    logLog('error','view','视图 '+ROUTE+' 渲染失败：'+err.message,err.stack);
    toast('页面渲染出错：'+err.message+'（已记录到日志）');
    try{$('#view').innerHTML='<div class="empty">页面渲染出错：'+esc(err.message)+'<br><button class="btn" onclick="RENDER()" style="margin-top:10px">重试</button></div>';}catch(_e){}
  }
}
$('#modal-mask').addEventListener('click',function(e){if(e.target===this)closeModal()});
/* C4a 全局快捷键：Ctrl+K 聚焦全局搜索 / Alt+1~9 切换九大板块（含帮助中心） / Ctrl+S 立即落盘 / Esc 关搜索浮层与弹窗 */
function globalHotkeys(ev){
  if(ev.key==='Escape'){
    var gp=document.getElementById('gs-panel');
    if(gp&&gp.style.display==='block'){closeGS();return}
    closeModal();return;
  }
  if((ev.ctrlKey||ev.metaKey)&&(ev.key==='k'||ev.key==='K')){
    ev.preventDefault();
    var i=document.getElementById('global-search');
    if(i){if(i.focus)i.focus();if(i.select)i.select()}
    return;
  }
  if((ev.ctrlKey||ev.metaKey)&&(ev.key==='s'||ev.key==='S')){
    ev.preventDefault();flushPersist();saveLogs();toast('已保存到本地');return;
  }
  if(ev.altKey&&!ev.ctrlKey&&!ev.metaKey&&ev.key>='1'&&ev.key<='9'){
    ev.preventDefault();
    var n=NAV[+ev.key-1];if(n)go(n.id);
  }
}
document.addEventListener('keydown',globalHotkeys);
applyTheme((function(){try{var t=localStorage.getItem(LS_THEME);return t||'light'}catch(e){return 'light'}})()); /* C7：首启恢复主题（默认亮色） */
startClock();
syncTime();
startDayRollGuard(); /* C13：跨天/休眠唤醒/焦点恢复三通道时间守卫 */

startPeriodicBackup(); /* C14：周期自动备份（满 24h 且备份后有数据变更才落盘） */

/* v1.0.32 自动备份：走 app.py 内置本地 HTTP 通道（bkport.js 由 app.py 启动时写入页面同目录，含端口+随机 token），
   JS fetch POST state JSON。为什么不用 pywebview.api / evaluate_js：该桥接在真机上随机死锁导致静默失效（详见 app.py start_backup_server 注释）；
   为什么不用 URL query 传端口：WebView2 加载 file:// 时会剥掉 query（History 库实证）。
   浏览器直开（无 bkport.js）与测试桩（无 window.__BKPORT）静默跳过；数据为空或请求失败时延迟重试 */
(function(){
  if(typeof window.__BKPORT!=='number')return;
  function tryBk(tries){
    if(tries<=0)return;
    try{new Image().src='http://127.0.0.1:'+window.__BKPORT+'/ping?t='+Date.now()}catch(e){} /* 观测点：页面探针，服务端记日志 */
    if(!(state.products&&state.products.length)){setTimeout(function(){tryBk(tries-1)},3000);return}
    /* C14：统一走 bkSendState（备份发送唯一入口，避免两处 fetch 口径漂移） */
    bkSendState(function(ok){if(ok)bkMarkSuccess();else setTimeout(function(){tryBk(tries-1)},3000)});
  }
  setTimeout(function(){tryBk(5)},5000);
})();
/* C5：7 天未备份启动提醒（有自动备份通道才检查；首启 5s 会自动备份并落标记，不会误报；登录页期间顺延 60s 重查，避免被登录层盖住） */
setTimeout(function(){
  if(typeof window.__BKPORT!=='number')return;
  function remind(){
    var am=document.getElementById('auth-mask');
    if(am&&am.style.display!=='none'){setTimeout(remind,60000);return}
    if(bkReminderDue(Date.now())){
      logLog('warn','backup','距上次成功备份已超过 7 天，建议点击顶栏「导出」备份一次');
      toast('⚠ 已超过 7 天未成功备份，建议导出一次备份');
    }
  }
  remind();
},12000);
/* C14：启动 15s 后校验最近一次自动备份完整性（等启动备份落盘完成），异常才告警 */
setTimeout(function(){bkVerify()},15000);
